<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глаголи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Literata:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one header row, flat tabs, one content column (two on wide screens).
   Colour: blue = НСВ, orange = СВ — the only accents. Yellow only marks the selected part of a word and changes.
   Type: Onest for the interface, Literata for every Bulgarian word. Spacing 4 / 8 / 16 / 24 / 32, radii 12 / 8. */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --sunk: #EFF1F4;
  --ink: #15171C;
  --muted: #5B606B;
  --line: #E3E6EB;
  --impf: #1F5FBF;
  --impf-soft: #E8EFFB;
  --pf: #B54708;
  --pf-soft: #FBEFE6;
  --on-accent: #FFFFFF;
  --hl: #FFE27A;
  --hl-soft: #FFF4C2;
  --ok: #1E7B4F;
  --bad: #B42318;
  --ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg-font: "Literata", "PT Serif", Georgia, "Times New Roman", serif;
  --t-xs: 12px; --t-s: 14px; --t-m: 16px; --t-l: 20px; --t-xl: 42px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px;
  --r: 12px; --r-s: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1A1D24; --sunk: #232731; --ink: #ECEEF2; --muted: #A3A9B5; --line: #2C313B;
    --impf: #84B3FF; --impf-soft: #1B2A44; --pf: #FFA463; --pf-soft: #3A2517; --on-accent: #111318;
    --hl: #7A6618; --hl-soft: #3A3418; --ok: #5FD39A; --bad: #FF8A7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1A1D24; --sunk: #232731; --ink: #ECEEF2; --muted: #A3A9B5; --line: #2C313B;
  --impf: #84B3FF; --impf-soft: #1B2A44; --pf: #FFA463; --pf-soft: #3A2517; --on-accent: #111318;
  --hl: #7A6618; --hl-soft: #3A3418; --ok: #5FD39A; --bad: #FF8A7A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--ui); font-size: var(--t-m); line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
p, h2, h3, h4 { margin: 0; }
.bg { font-family: var(--bg-font); }
b.i, .i-txt { color: var(--impf); }
b.p, .p-txt { color: var(--pf); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
.muted { color: var(--muted); }
.small { font-size: var(--t-s); }

/* Header */
header.top { padding-block: var(--s3) var(--s2); }
.top-row { display: flex; align-items: center; gap: var(--s2); }
.brand { font-weight: 700; font-size: var(--t-l); letter-spacing: -.01em; min-width: 0; }
.brand small { font-weight: 500; font-size: var(--t-s); color: var(--muted); margin-left: var(--s2); }
.spacer { flex: 1; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--sunk); color: var(--muted); font-size: var(--t-s); font-weight: 600; cursor: pointer; }
.chipbtn .acc { font-family: var(--bg-font); font-size: 17px; line-height: 1; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.help { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--sunk); font-weight: 700; cursor: pointer; flex: none; }
.help[aria-expanded="true"] { background: var(--ink); color: var(--bg); }
.lang { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; flex: none; }
.lang button { border: 0; background: none; min-width: 40px; height: 30px; border-radius: 999px; font-weight: 600; font-size: var(--t-s); cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
@media (max-width: 480px) {
  .brand small, .chipbtn .lbl { display: none; }
  .chipbtn { width: 36px; padding: 0; justify-content: center; }
}
.legend, .notice { margin-top: var(--s2); background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s2); font-size: var(--t-s); }
.notice { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding-block: var(--s2); }
.notice .link { min-height: 36px; text-decoration: none; }
.tts-set { display: grid; gap: var(--s2); padding-top: var(--s2); border-top: 1px solid var(--line); }
.seg.ttsseg { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.seg.ttsseg button { white-space: normal; padding: var(--s1) var(--s2); }
.legend .row { display: flex; gap: var(--s2); align-items: baseline; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.i { background: var(--impf); }
.dot.p { background: var(--pf); }
.dot.h { background: var(--hl); }

/* Tabs: flat and neutral; the active one is underlined */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: var(--s1); }
.tab { display: inline-flex; align-items: center; gap: var(--s2); height: 46px; padding: 0 var(--s3); margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 500; font-size: 15px; cursor: pointer; }
.tab svg { width: 18px; height: 18px; flex: none; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
@media (max-width: 560px) {
  nav.tabs .wrap { gap: 0; }
  .tab { flex: 1 1 0; justify-content: center; padding: 0 4px; font-size: var(--t-s); }
  .tab svg { display: none; }
}

main { padding-block: var(--s4); }
section[role="tabpanel"] { display: grid; gap: var(--s3); scroll-margin-top: 64px; }
h2 { font-size: var(--t-l); font-weight: 700; line-height: 1.25; text-wrap: balance; }
/* section headings: small, sentence case, a little bolder than body text */
.label { font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--ink); }
.panel { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); min-width: 0; align-content: start; }
.link { border: 0; background: none; padding: 0; min-height: 44px; color: var(--ink); font-weight: 600; font-size: var(--t-s); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-decoration-thickness: 2px; text-underline-offset: 4px; justify-self: start; }
.link:hover { text-decoration-color: var(--ink); }
.na { color: var(--muted); font-style: italic; font-size: var(--t-s); }
.aux { color: var(--muted); font-weight: 400; }
.endc { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; text-decoration-skip-ink: none; }
.tts { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; font-size: 17px; line-height: 1; cursor: pointer; flex: none; vertical-align: middle; }
.tts:hover { background: var(--sunk); }
.quote .tts { width: 30px; height: 30px; font-size: 15px; margin-left: 2px; }

/* ---------- Builder ---------- */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: var(--s3); align-items: start; }
.b-col { display: grid; gap: var(--s3); min-width: 0; }
.vwrap { display: grid; gap: var(--s2); min-width: 0; }
@media (max-width: 820px) {
  .builder { grid-template-columns: minmax(0, 1fr); }
  .b-col { display: contents; }
  .vwrap { order: 1; } .ctl { order: 2; } .tpanel { order: 3; } .b-ex { order: 4; }
}
.vpick-row { display: flex; gap: var(--s2); align-items: stretch; }
.vpick-row .star { background: var(--surface); width: 56px; height: auto; border-radius: var(--r); }
.vpick { flex: 1; min-width: 0; width: 100%; display: flex; align-items: center; gap: var(--s2); min-height: 56px; border: 0; background: var(--surface); border-radius: var(--r); padding: var(--s2) var(--s3); cursor: pointer; text-align: left; }
.vpick .txt { display: grid; flex: 1; min-width: 0; }
.vpick .pair { font-family: var(--bg-font); font-weight: 600; font-size: var(--t-l); }
.vpick .vmean { font-size: var(--t-s); color: var(--muted); }
.chev { color: var(--muted); }
.picker { background: var(--surface); border-radius: var(--r); padding: var(--s2); display: grid; gap: var(--s2); }
.pcount { font-size: var(--t-s); color: var(--muted); padding-inline: var(--s2); }
.search { width: 100%; border: 0; background: var(--sunk); border-radius: var(--r-s); padding: 0 var(--s3); height: 48px; font-size: var(--t-m); }
.plist { display: grid; max-height: 360px; overflow-y: auto; }
.prow { text-align: left; border: 0; background: none; padding: var(--s2); min-height: 52px; border-radius: var(--r-s); cursor: pointer; display: grid; }
.prow:hover { background: var(--sunk); }
.prow .pair { font-family: var(--bg-font); font-weight: 600; }
.prow .vmean { font-size: var(--t-s); color: var(--muted); }

.ctl { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: var(--r-s); padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 6px; font-weight: 600; font-size: var(--t-s); color: var(--muted); cursor: pointer; padding: 0 var(--s2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.seg button:disabled { opacity: .35; cursor: default; }
.tlist { display: flex; flex-wrap: wrap; gap: var(--s2); }
.tbtn { display: inline-flex; align-items: center; gap: var(--s2); border: 0; background: var(--sunk); border-radius: 999px; min-height: 44px; padding: 0 var(--s3) 0 var(--s2); cursor: pointer; font-weight: 600; font-size: var(--t-s); }
.tbtn.rare { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.negbtn { border: 0; background: var(--sunk); border-radius: var(--r-s); min-height: 44px; min-width: 56px; font-family: var(--bg-font); font-weight: 600; cursor: pointer; color: var(--muted); }
.negbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* the table panel: tools, the selected form large in the middle, then every person */
.tpanel { gap: 0; padding: var(--s3) var(--s2); }
.t-tools { display: flex; align-items: center; gap: var(--s2); padding-inline: var(--s2); flex-wrap: wrap; }
.t-tools .t-name { display: inline-flex; align-items: center; gap: var(--s2); flex: 1 1 auto; min-width: 0; font-size: var(--t-s); }
.t-tools .seg button { min-height: 36px; min-width: 40px; }
.t-pr { padding-top: var(--s2); }
.t-k { font-size: var(--t-s); color: var(--muted); }
.seg.prseg button.bg { font-family: var(--bg-font); }
.qbtn { font-family: var(--bg-font); }
.t-note { font-size: var(--t-s); color: var(--muted); padding: var(--s3) var(--s2) 0; }
.cl { color: var(--ink); font-weight: 600; }
.b-hero { display: grid; justify-items: center; text-align: center; gap: var(--s2); padding: var(--s5) var(--s3) var(--s4); }
.b-pron { font-size: var(--t-s); font-weight: 600; color: var(--muted); }
.b-wordrow { display: flex; align-items: center; justify-content: center; gap: var(--s1); flex-wrap: wrap; max-width: 100%; }
.b-word { font-family: var(--bg-font); font-size: var(--t-xl); line-height: 1.2; font-weight: 600; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: .28em; min-width: 0; }
.b-word .w { white-space: nowrap; }
.pc { border: 0; background: none; padding: 0 2px; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; transition: background-color .5s ease; }
.pc.k-pt, .pc.k-se, .pc.k-q { color: var(--muted); font-weight: 400; }
.pc.k-cl { color: var(--ink); }
.pc.k-q { cursor: default; padding: 0; margin-left: -.24em; }
.pc.k-stem.impf, .pc.k-end.impf { color: var(--impf); }
.pc.k-stem.pf, .pc.k-end.pf { color: var(--pf); }
.pc.k-end { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; text-decoration-skip-ink: none; }
.pc[aria-pressed="true"] { background: var(--hl-soft); box-shadow: inset 0 -3px 0 var(--hl); }
.pc.chg { animation: chg 1.1s ease-out; }
.b-word.fade { animation: fade .35s ease-out; }
@keyframes chg { 0% { background: var(--hl); } 100% { background: transparent; } }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.b-info { font-size: var(--t-s); color: var(--muted); max-width: 44ch; min-height: 3em; }
.b-na { font-size: var(--t-m); color: var(--muted); max-width: 36ch; }
table.ftable { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.ftable col.cw { width: 3.6em; }
table.ftable.one, table.vgrid.one { max-width: 520px; }
table.ftable thead th { font-size: var(--t-xs); font-weight: 600; text-align: left; padding: var(--s2); border-bottom: 1px solid var(--line); }
table.ftable thead th .bg { font-weight: 600; font-size: var(--t-s); }
table.ftable thead th.i { color: var(--impf); }
table.ftable thead th.p { color: var(--pf); }
table.ftable th.who { font-family: var(--bg-font); font-weight: 400; font-size: var(--t-s); color: var(--muted); text-align: left; padding-left: var(--s2); }
table.ftable td { padding: 2px; }
.fcell { width: 100%; min-height: 46px; border: 0; background: none; border-radius: var(--r-s); text-align: left; padding: 6px var(--s2); font-family: var(--bg-font); font-size: 17px; font-weight: 600; line-height: 1.3; cursor: pointer; transition: background-color .4s ease; }
.fcell:hover { background: var(--sunk); }
.fcell.i { color: var(--impf); }
.fcell.p { color: var(--pf); }
.fcell.empty { color: var(--muted); font-weight: 400; }
.fcell[aria-pressed="true"] { background: var(--sunk); }
.fcell.chg { animation: chg 1.1s ease-out; }
table.ftable.fade tbody { animation: fade .35s ease-out; }
@media (prefers-reduced-motion: reduce) { .pc.chg, .b-word.fade, .fcell.chg, table.ftable.fade tbody { animation: none; } }
.b-meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; font-size: var(--t-s); color: var(--muted); padding: var(--s2) var(--s2) 0; }
.b-meta b { color: var(--ink); }
.b-meta .link { margin-left: auto; }
@media (max-width: 520px) {
  .b-word { font-size: 34px; }
  .b-hero { padding: var(--s4) var(--s2) var(--s3); }
  .fcell { font-size: 16px; padding-inline: 6px; }
  table.ftable col.cw { width: 3.1em; }
}
@media (max-width: 400px) {
  .fcell { font-size: 15px; padding-inline: 4px; overflow-wrap: anywhere; }
  table.ftable col.cw { width: 2.8em; }
}

/* Examples */
.ex { display: grid; gap: var(--s3); }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.quote { display: grid; gap: 2px; padding-left: var(--s3); border-left: 2px solid var(--line); }
.quote .bgt { font-family: var(--bg-font); font-size: 17px; line-height: 1.5; }
.quote .tr { color: var(--muted); font-size: var(--t-s); }
body.no-tr .quote .tr { display: none; }
.trt { display: inline-flex; gap: 6px; align-items: center; font-size: var(--t-s); color: var(--muted); cursor: pointer; min-height: 44px; }

/* Tense icons */
.ticon { width: 44px; height: 13px; flex: none; }
.ticon .l { stroke: currentColor; stroke-width: 1.5; opacity: .3; fill: none; }
.ticon .n { stroke: currentColor; stroke-width: 2; opacity: .55; fill: none; }
.ticon .m { fill: currentColor; }
.ticon .o { fill: none; stroke: currentColor; stroke-width: 1.5; }
.ticon .a { stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ticon .d { stroke-dasharray: 2 2; }
.ticon circle.d { fill: none; stroke: currentColor; stroke-width: 1.6; }
.ticon .w { stroke-width: 2.6; }

/* ---------- Tenses ---------- */
.ttop { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s3); align-items: start; }
@media (max-width: 820px) { .ttop { grid-template-columns: minmax(0, 1fr); } }
.choose { display: grid; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 9.5em; gap: var(--s2); align-items: center; text-align: left; border: 0; background: none; min-height: 48px; padding: var(--s2); border-radius: var(--r-s); cursor: pointer; }
.crow + .crow { border-top: 1px solid var(--line); }
.crow:hover { background: var(--sunk); }
.crow .say { font-size: var(--t-s); }
.crow .ctn { display: inline-flex; gap: var(--s2); align-items: center; font-weight: 600; font-size: var(--t-s); }
.asp { display: grid; gap: var(--s2); }
.aspc { display: grid; gap: 2px; padding: var(--s2) var(--s3); border-radius: var(--r-s); font-size: var(--t-s); }
.aspc.i { background: var(--impf-soft); }
.aspc.p { background: var(--pf-soft); }
.aspc.i b { color: var(--impf); }
.aspc.p b { color: var(--pf); }
.aspc .sigs { font-family: var(--bg-font); color: var(--muted); }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: var(--s3); align-items: start; }
.tcard { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); min-width: 0; scroll-margin-top: 64px; }
.tc-h { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s2) var(--s3); align-items: center; }
.tc-h .ticon { width: 56px; height: 16px; }
.tc-h .tn { font-weight: 700; font-size: 18px; line-height: 1.25; }
.tc-sub { grid-column: 1 / -1; font-size: var(--t-s); color: var(--muted); }
.tc-sub .bg { color: var(--ink); }
.formula { font-size: var(--t-s); color: var(--muted); }
.formula b { color: var(--ink); font-weight: 600; }
.strip-wrap { overflow-x: auto; background: var(--sunk); border-radius: var(--r-s); padding: var(--s2); }
table.strip { border-collapse: collapse; width: 100%; }
table.strip th { font-size: var(--t-xs); font-weight: 600; color: var(--muted); text-align: left; padding: 2px 6px; font-family: var(--bg-font); }
table.strip td { font-family: var(--bg-font); font-weight: 700; font-size: 17px; padding: 4px 6px; white-space: nowrap; }
table.strip td.g { font-family: var(--ui); font-size: var(--t-xs); font-weight: 600; color: var(--muted); }
.after { font-size: var(--t-s); color: var(--muted); }
.tc-links { display: flex; gap: var(--s4); flex-wrap: wrap; }
.tsolo { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
.tgroup { display: grid; gap: var(--s1); }
#tpick { gap: var(--s2); }
.tc-more { display: grid; gap: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); }
.tc-more .label { margin-bottom: var(--s1); }
ul.clean { margin: 0; padding-left: 18px; display: grid; gap: var(--s1); font-size: var(--t-s); }
.signals { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); font-family: var(--bg-font); }
.sig { background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: var(--t-s); }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); font-size: var(--t-s); }
.tips li { padding-left: 16px; position: relative; }
.tips li::before { content: "–"; position: absolute; left: 0; color: var(--muted); }
.compare { background: var(--sunk); border-radius: var(--r-s); padding: var(--s2) var(--s3); font-size: var(--t-s); display: grid; gap: var(--s1); }
.stems > summary { list-style: none; cursor: pointer; }
.stems > summary::-webkit-details-marker { display: none; }
.stems > summary .label::after { content: " ▾"; color: var(--muted); }
table.plain { width: 100%; border-collapse: collapse; font-size: var(--t-s); }
table.plain td { padding: var(--s2) 6px; vertical-align: top; border-bottom: 1px solid var(--line); }
table.plain td:first-child { font-weight: 600; white-space: nowrap; }

/* ---------- Verbs ---------- */
.vlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: var(--s2); }
.vrow { display: flex; align-items: stretch; background: var(--surface); border-radius: var(--r-s); min-width: 0; }
.vmain { flex: 1; min-width: 0; text-align: left; border: 0; background: none; border-radius: var(--r-s) 0 0 var(--r-s); padding: var(--s2) var(--s2) var(--s2) var(--s3); min-height: 60px; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 var(--s2); align-items: center; }
.vmain:hover { background: var(--sunk); }
.vrow .pair { font-family: var(--bg-font); font-weight: 600; font-size: 17px; }
.vrow .vmean { font-size: var(--t-s); color: var(--muted); grid-column: 1; }
.vrow .grp { grid-column: 2; grid-row: 1 / span 2; font-size: var(--t-xs); color: var(--muted); font-weight: 600; text-align: right; }
.star { flex: none; width: 44px; min-height: 44px; border: 0; background: none; border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; }
.star:hover { background: var(--sunk); }
.star[aria-pressed="true"] { color: var(--pf); }
.favbtn { border: 0; background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: var(--t-xs); font-weight: 600; color: var(--muted); cursor: pointer; min-height: 24px; }
.favbtn[aria-pressed="true"] { color: var(--pf); background: var(--pf-soft); }
.seg.vfilt { justify-self: start; grid-auto-columns: auto; }
.seg.vfilt button { padding: 0 var(--s3); }
.badge { display: inline-block; font-size: var(--t-xs); font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); font-style: normal; }
.badge.i { background: var(--impf-soft); color: var(--impf); }
.badge.p { background: var(--pf-soft); color: var(--pf); }
.dash { color: var(--muted); }
.search-row { display: flex; gap: var(--s3); align-items: center; }
.count { color: var(--muted); font-size: var(--t-s); white-space: nowrap; }
.back { border: 0; background: none; padding: 0; min-height: 44px; color: var(--muted); font-weight: 600; cursor: pointer; justify-self: start; }
.vhead { display: grid; gap: var(--s2); }
.pairbig { font-family: var(--bg-font); font-size: 28px; line-height: 1.2; font-weight: 600; }
.badges { display: flex; gap: var(--s1); flex-wrap: wrap; }
.note { background: var(--surface); border-radius: var(--r-s); padding: var(--s2) var(--s3); font-size: var(--t-s); }
.vgrid-head { display: grid; gap: var(--s2); }
.pseg { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--sunk); border-radius: var(--r-s); padding: 3px; gap: 3px; }
.pseg button { border: 0; background: none; min-height: 40px; border-radius: 6px; font-family: var(--bg-font); font-weight: 600; font-size: var(--t-s); color: var(--muted); cursor: pointer; padding: 0; }
.pseg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.gwrap { overflow-x: auto; margin-inline: calc(var(--s3) * -1); }
table.vgrid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
table.vgrid col.c0 { width: 34%; }
table.vgrid th, table.vgrid td { padding: 0; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
table.vgrid thead th { font-size: var(--t-xs); font-weight: 600; padding: var(--s2); font-family: var(--bg-font); }
table.vgrid thead th.i { color: var(--impf); }
table.vgrid thead th.p { color: var(--pf); }
table.vgrid .stick { position: sticky; left: 0; background: var(--surface); z-index: 1; padding-left: var(--s3); }
.tlink { display: inline-flex; gap: var(--s2); align-items: center; border: 0; background: none; cursor: pointer; font-size: var(--t-s); font-weight: 600; color: var(--muted); min-height: 52px; padding: 0 var(--s2) 0 0; text-align: left; }
.tlink span { min-width: 0; hyphens: manual; overflow-wrap: break-word; }
.cell { border: 0; background: none; cursor: pointer; min-height: 52px; padding: var(--s2); border-radius: var(--r-s); font-family: var(--bg-font); font-size: var(--t-m); font-weight: 600; text-align: left; width: 100%; }
.cell:hover { background: var(--sunk); }
.cell.i { color: var(--impf); }
.cell.p { color: var(--pf); }
@media (max-width: 520px) { .tlink .ticon { display: none; } .tlink { font-size: var(--t-xs); } table.vgrid col.c0 { width: 30%; } table.vgrid .stick { padding-left: var(--s2); } .cell { font-size: 14px; padding: 6px 4px; overflow-wrap: anywhere; } .pairbig { font-size: 24px; } }

/* ---------- Practice ---------- */
.pr { display: grid; gap: var(--s3); max-width: 720px; min-width: 0; }
.pr > * { min-width: 0; }
.pr-filter { display: grid; gap: var(--s2); }
.dd > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 10px var(--s3); background: var(--surface); border-radius: var(--r-s); font-size: 15px; min-width: 0; }
.dd > summary::-webkit-details-marker { display: none; }
.dd > summary::after { content: "▾"; margin-left: auto; padding-left: var(--s2); color: var(--muted); }
.dd[open] > summary::after { content: "▴"; }
.dd-k { color: var(--muted); flex: none; }
.dd-v { font-weight: 600; min-width: 0; line-height: 1.35; }
.dd-panel { margin-top: var(--s1); background: var(--surface); border-radius: var(--r-s); padding: var(--s2) var(--s3); display: grid; gap: var(--s1); }
.dd-panel label { display: flex; align-items: center; gap: var(--s2); min-height: 38px; font-size: 15px; cursor: pointer; }
.dd-panel input { width: 18px; height: 18px; margin: 0; flex: none; }
.dd-all { font-weight: 600; border-bottom: 1px solid var(--line); }
.dd-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); column-gap: var(--s3); }
.seg.pasp { grid-template-columns: auto; grid-auto-columns: 1fr; align-items: center; }
.seg .seg-k { padding: 0 var(--s2) 0 var(--s2); font-size: var(--t-s); color: var(--muted); }
.pr-row { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; }
.seg.pinput { grid-template-columns: auto; grid-auto-columns: 1fr; align-items: center; flex: 1 1 260px; }
.favchk { display: inline-flex; align-items: center; gap: var(--s2); font-size: var(--t-s); min-height: 44px; cursor: pointer; }
.favchk input { width: 18px; height: 18px; margin: 0; }
.ptype { display: grid; gap: var(--s2); }
.pr-hint2 { font-size: var(--t-s); }
.pr-hint2 .bg { font-size: 17px; font-weight: 600; }
.ptype-row { display: flex; gap: var(--s2); }
.ptype-row .pans { flex: 1; min-width: 0; font-family: var(--bg-font); font-size: 18px; height: 52px; }
.pans.ok { box-shadow: inset 0 0 0 1.5px var(--ok); color: var(--ok); }
.pans.bad { box-shadow: inset 0 0 0 1.5px var(--bad); color: var(--bad); }
.ptype-row .btn { min-height: 52px; padding: 0 var(--s3); }
.letters { display: flex; flex-wrap: wrap; gap: var(--s1); }
.letter { border: 0; background: var(--sunk); border-radius: var(--r-s); min-width: 40px; height: 40px; font-size: 18px; font-weight: 600; cursor: pointer; }
.letter:hover { background: var(--line); }
.pr-score { display: flex; gap: var(--s3); flex-wrap: wrap; font-size: var(--t-s); color: var(--muted); }
.pr-score b { color: var(--ink); }
.pr-prompt { display: grid; gap: var(--s2); }
.pr-prompt .pair { font-family: var(--bg-font); font-weight: 600; font-size: var(--t-l); }
.pr-tags { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.pr-tag { background: var(--sunk); border-radius: 999px; padding: 4px 12px; font-size: var(--t-s); font-weight: 600; }
.pr-tag.bg { font-family: var(--bg-font); }
.pr-tag.i { background: var(--impf-soft); color: var(--impf); }
.pr-tag.p { background: var(--pf-soft); color: var(--pf); }
.pr-sent { font-family: var(--bg-font); font-size: 20px; line-height: 1.5; }
.pr-tr { color: var(--muted); font-size: var(--t-s); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--ink); text-align: center; color: var(--muted); }
.blank.filled { border-bottom-color: var(--ok); color: var(--ok); font-weight: 700; min-width: 0; padding-inline: 2px; }
.pr-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
@media (max-width: 480px) { .pr-opts { grid-template-columns: minmax(0, 1fr); } }
.opt { display: flex; align-items: center; gap: var(--s2); min-height: 56px; border: 0; border-radius: var(--r-s); background: var(--sunk); padding: var(--s2) var(--s3); cursor: pointer; text-align: left; font-family: var(--bg-font); font-size: 18px; font-weight: 600; color: var(--ink); }
.opt:hover { background: var(--line); }
.opt > span:nth-child(2) { min-width: 0; overflow-wrap: anywhere; }
.opt .key { font-family: var(--ui); font-size: var(--t-xs); font-weight: 700; color: var(--muted); background: var(--surface); border-radius: 6px; min-width: 22px; height: 22px; display: grid; place-items: center; flex: none; }
.opt .mark { margin-left: auto; font-family: var(--ui); font-weight: 700; }
.opt.ok { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--ok); color: var(--ok); }
.opt.bad { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--bad); color: var(--bad); }
.opt.dim { opacity: .45; }
.opt[aria-disabled="true"] { cursor: default; }
.opt[aria-disabled="true"]:hover { background: var(--sunk); }
.opt.ok[aria-disabled="true"]:hover, .opt.bad[aria-disabled="true"]:hover { background: var(--surface); }
.pr-why { display: grid; gap: var(--s2); background: var(--sunk); border-radius: var(--r-s); padding: var(--s3); font-size: var(--t-s); }
.pr-why .verdict { font-weight: 700; font-size: var(--t-m); }
.pr-why .verdict.ok { color: var(--ok); }
.pr-why .verdict.bad { color: var(--bad); }
.pr-why .full { font-family: var(--bg-font); font-size: 17px; }
.pr-next { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
.pr-empty { justify-items: start; }
.btn { border: 0; background: var(--ink); color: var(--bg); border-radius: var(--r-s); min-height: 48px; padding: 0 var(--s4); font-weight: 700; font-size: var(--t-m); cursor: pointer; }
.pr-hint { font-size: var(--t-xs); color: var(--muted); }

footer { color: var(--muted); font-size: var(--t-xs); padding-block: 0 var(--s5); }
</style>

</head>

<script>
/* Verb pairs from "100 common aspectual pairs in Bulgarian" (Study in BG), plus three model verbs.
   Spec format:
     group III verb  → just the аз-form: "вдигам"
     group I / II    → "аз|ти|aorist аз|-л participle (m)[|imperfect аз]"
   Everything else is derived in grammar.js. `x` holds the irregular forms the rules can't produce. */
window.VERB_DATA = [
  ["вдигам", "вдигна|вдигнеш|вдигнах|вдигнал", "поднимать / поднять (трубку)", [
    ["– Ще вдигнеш ли телефона? – Не, никога не вдигам, когато видя непознат номер.", "– Ты возьмёшь трубку? – Нет, я никогда не беру трубку, когда вижу незнакомый номер."]]],
  ["вземам", "взема|вземеш|взех|взел", "брать / взять", [
    ["Обикновено вземам автобус, но днес бързам и ще взема такси.", "Обычно я езжу на автобусе, но сегодня тороплюсь и возьму такси."]]],
  ["виждам", "видя|видиш|видях|видял", "видеть / увидеть", [
    ["Не виждаш ли, че навън вали дъжд? Ще видим дали мога да ти помогна.", "Разве ты не видишь, что на улице идёт дождь? Посмотрим, смогу ли я тебе помочь."]],
    { xp: { impv: ["виж", "вижте"] } }],
  ["виждам", "видя|видиш|видях|видял", "встречаться / встретиться (с кем-то)", [
    ["Виждам се с приятелите си всеки петък. Тази седмица ще се видя с тях и в събота.", "Я встречаюсь с друзьями каждую пятницу. На этой неделе я увижусь с ними и в субботу."]],
    { se: "се", tail: "с", xp: { impv: ["виж", "вижте"] } }],
  ["влизам", "вляза|влезеш|влязох|влязъл", "входить / войти", [
    ["Не, няма да влизам, защото бързам. Искам да вляза в магазина за 5 минути.", "Нет, я не буду заходить, потому что тороплюсь. Хочу зайти в магазин на 5 минут."]],
    { xp: { impv: ["влез", "влезте"] } }],
  ["връщам", "върна|върнеш|върнах|върнал", "возвращать / вернуть (что-то)", [
    ["Кога ще ми върнеш книгата? Ти винаги вземаш нещо назаем, а после не връщаш.", "Когда ты вернёшь мне книгу? Ты всегда берёшь что-то взаймы, а потом не возвращаешь."]]],
  ["връщам", "върна|върнеш|върнах|върнал", "возвращаться / вернуться", [
    ["Антон вече се връща вкъщи, а децата му ще се върнат по-късно, защото са на концерт.", "Антон уже возвращается домой, а его дети вернутся позже, потому что они на концерте."]],
    { se: "се" }],
  ["давам", "дам|дадеш|дадох|дал", "давать / дать", [
    ["– Ще ми дадеш ли 50 лв. назаем? – Вместо 50 лв. ти давам съвет да не вземаш пари назаем.", "– Дашь мне 50 левов взаймы? – Вместо 50 левов даю тебе совет не брать деньги в долг."]],
    { xp: { impv: ["дай", "дайте"] } }],
  ["добавям", "добавя|добавиш|добавих|добавил", "добавлять / добавить", [
    ["– Ще добавиш ли нещо към кафето? – Не, никога не добавям нищо.", "– Добавишь что-нибудь в кофе? – Нет, я никогда ничего не добавляю."]]],
  ["донасям", "донеса|донесеш|донесох|донесъл", "приносить / принести", [
    ["Като се връща от командировка, баща ми винаги донася сувенири. И този път ще донесе нещо за спомен.", "Когда отец возвращается из командировки, он всегда привозит сувениры. И в этот раз привезёт что-нибудь на память."]]],
  ["забравям", "забравя|забравиш|забравих|забравил", "забывать / забыть", [
    ["Рядко забравям имената на хората, с които се запознавам. Ако не запишеш телефонния номер, рискуваш да го забравиш.", "Я редко забываю имена людей, с которыми знакомлюсь. Если не запишешь номер телефона, рискуешь его забыть."]]],
  ["завивам", "завия|завиеш|завих|завил", "поворачивать / повернуть", [
    ["Гледай къде завиваш! Тази улица е еднопосочна. Ако завием надясно по първата улица, ще стигнем до офиса по-бързо.", "Смотри, куда поворачиваешь! Эта улица с односторонним движением. Если свернём направо на первом повороте, доберёмся до офиса быстрее."]]],
  ["закусвам", "закуся|закусиш|закусих|закусил", "завтракать / позавтракать", [
    ["Рядко закусвам вкъщи, защото винаги бързам. Този път ще закуся яйца на очи и препечена филийка, защото имам време.", "Я редко завтракаю дома, потому что всегда тороплюсь. В этот раз съем на завтрак яичницу и тост, потому что есть время."]]],
  ["заключвам", "заключа|заключиш|заключих|заключил", "запирать / запереть", [
    ["Моля последния, който излиза, да заключи вратата! Няма смисъл да заключваш, след малко ще дойдат останалите.", "Прошу последнего, кто выходит, запереть дверь! Нет смысла запирать, скоро придут остальные."]]],
  ["закъснявам", "закъснея|закъснееш|закъснях|закъснял", "опаздывать / опоздать", [
    ["Иван никога не идва навреме, винаги закъснява. Ще закъснея с 30 минути, не ме чакайте.", "Иван никогда не приходит вовремя, всегда опаздывает. Я опоздаю на 30 минут, не ждите меня."]]],
  ["заминавам", "замина|заминеш|заминах|заминал", "уезжать / уехать", [
    ["Рано сутринта заминавам за Лондон. Ще заминат веднага щом получат документите си.", "Рано утром я уезжаю в Лондон. Они уедут, как только получат свои документы."]]],
  ["запознавам", "запозная|запознаеш|запознах|запознал", "знакомить / познакомить", [
    ["Елате, искам да Ви запозная с шефа си! Иван запознава приятелите си с братовчед си.", "Подойдите, хочу познакомить Вас со своим начальником! Иван знакомит своих друзей с двоюродным братом."]]],
  ["запознавам", "запозная|запознаеш|запознах|запознал", "знакомиться / познакомиться", [
    ["Най-често се запознавам с нови хора в офиса. Петър трябва да се запознае с правилата на компанията.", "Чаще всего я знакомлюсь с новыми людьми в офисе. Петру нужно ознакомиться с правилами компании."]],

  function norm(x) {
    return String(x || "").normalize("NFD").replace(/[̀́]/g, "").normalize("NFC").toLowerCase()
      .replace(/[.,!?;:…"„“«»–—-]/g, " ").replace(/\s+/g, " ").trim();
  }
  function checkTyped() {
    if (P.input !== "type" || P.ans >= 0 || !P.q || P.q.empty) return;
    var el = $("pans"), val = el ? el.value : "";
    if (!norm(val)) { if (el) el.focus(); return; }
    var n = norm(val), acc = (P.q.acc || [P.q.ok]).map(norm);
    P.typed = val; P.ans = 0;
    P.okTyped = acc.indexOf(n) >= 0; P.altHit = P.okTyped && n !== norm(P.q.ok);
    score(P.okTyped);
    renderPractice();
    focusAnswer();
  }
  function focusAnswer() { var el = $("pans"); if (el) try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  function nextQ() {
    P.q = genQ(); P.ans = -1; P.typed = ""; P.okTyped = false; P.altHit = false;
    renderPractice();
    var c = document.querySelector(".pr-card"); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: "start" });
    if (P.input === "type") focusAnswer();
  }
  function filterChanged() { saveFilter(); P.deck = []; P.q = genQ(); P.ans = -1; P.typed = ""; renderPractice(); }

  /* ---------- Routing ---------- */
  function setHash() {
    var h = S.tab === "verbs" ? (S.verb !== null ? "verb-" + S.verb : "verbs") : S.tab;
    try { history.replaceState(null, "", "#" + h); } catch (e) { /* ignore */ }
  }
  function readHash() {
    var h = (location.hash || "").slice(1), m;
    if ((m = /^verb-(\d+)$/.exec(h)) && VERBS[+m[1]]) { S.tab = "verbs"; S.verb = +m[1]; }
    else if (h === "verbs") { S.tab = "verbs"; S.verb = null; }
    else if (h === "tenses") S.tab = "tenses";
    else if ((m = /^t-(\w+)$/.exec(h)) && TBY[m[1]]) { S.tab = "tenses"; S.tsel = m[1]; S.jump = m[1]; }
    else if (h === "form") S.tab = "form";
    else if (h === "practice") S.tab = "practice";
  }
  function render() {
    renderChrome();
    if (S.tab === "form") renderForm();
    if (S.tab === "tenses") renderTenses();
    if (S.tab === "verbs") renderVerbs();
    if (S.tab === "practice") renderPractice();
    setHash();
    if (S.jump) { var el = $("t-" + S.jump); S.jump = null; if (el) el.scrollIntoView({ block: "start" }); }
  }
  function go(fn) { fn(); render(); window.scrollTo(0, 0); }
  function setB(fn, anim) { fn(S.B); S.B.sel = -1; S.anim = anim || "chg"; saveB(); renderForm(); }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("button");
    if (!el) return;
    var d = el.dataset;
    if (d.say !== undefined) { speak(d.say); return; }
    if (d.ttsmode !== undefined) {
      TTS.online = d.ttsmode; store.set("ttsOnline", TTS.online); stopAudio(); ttsUpdate(); render(); return;
    }
    if ("ttsset" in d) { S.legend = true; $("notice").hidden = true; renderChrome(); var ts = document.querySelector(".tts-set"); if (ts) ts.scrollIntoView({ block: "center" }); return; }
    if (d.fav !== undefined) { toggleFav(VERBS[+d.fav]); render(); return; }
    if (d.vfilt) { S.vfilter = d.vfilt; store.set("vfilter", S.vfilter); renderVerbs(); return; }
    if (d.letter) {
      var inp = $("pans");
      if (inp && !inp.readOnly) {
        var a0 = inp.selectionStart == null ? inp.value.length : inp.selectionStart, a1 = inp.selectionEnd == null ? a0 : inp.selectionEnd;
        inp.value = inp.value.slice(0, a0) + d.letter + inp.value.slice(a1);
        inp.focus(); inp.setSelectionRange(a0 + d.letter.length, a0 + d.letter.length);
      }
      return;
    }
    if (el.id === "help") { S.legend = !S.legend; renderChrome(); return; }
    if (el.id === "stressBtn") { S.stress = !S.stress; store.set("stress", S.stress ? "1" : "0"); render(); return; }
    if ("closenotice" in d) { $("notice").hidden = true; return; }
    if (d.lang) { S.lang = d.lang; store.set("lang", S.lang); render(); return; }
    if (d.tab) { go(function () { if (d.tab === "verbs" && S.tab === "verbs") S.verb = null; S.tab = d.tab; }); return; }
    // builder
    if ("pick" in d) { S.B.picking = !S.B.picking; renderForm(); return; }
    if (d.bverb) { setB(function (B) { B.verb = +d.bverb; B.picking = false; B.q = ""; }, "fade"); return; }
    if (d.bgroup) { setB(function (B) { var g = GROUPS.filter(function (x) { return x.id === d.bgroup; })[0]; if (g.t.indexOf(B.tense) < 0) B.tense = g.t[0]; }, "fade"); return; }
    if (d.btense) { setB(function (B) { B.tense = d.btense; }, "fade"); return; }
    if (d.bgen) { setB(function (B) { B.gender = d.bgen; }); return; }
    if ("bneg" in d) { setB(function (B) { B.neg = !B.neg; }); return; }
    if ("bask" in d) { setB(function (B) { B.ask = !B.ask; }); return; }
    if (d.bpr !== undefined) { setB(function (B) { B.pr = d.bpr; }); return; }
    if (d.fcell) {
      var fc = d.fcell.split("|");
      S.B.person = +fc[0]; S.B.pf = fc[1] === "1"; S.B.sel = -1; S.anim = "sel"; saveB(); renderForm(); return;
    }
    if (d.piece) { S.B.sel = +d.piece; renderForm(); return; }
    if (d.totense) { go(function () { S.tab = "tenses"; S.tsel = d.totense; S.jump = d.totense; }); return; }
    // tenses
    if (d.tobuilder) { S.B.tense = d.tobuilder; S.B.sel = -1; saveB(); go(function () { S.tab = "form"; }); return; }
    if (d.tsel) { S.tsel = d.tsel; renderTenses(); return; }
    if (d.jump) { S.tsel = d.jump; renderTenses(); var j = $("t-" + d.jump); if (j) j.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
    // practice
    if (d.pmode) { P.mode = d.pmode; store.set("pmode", P.mode); P.deck = []; P.q = genQ(); P.ans = -1; renderPractice(); return; }
    if (d.pasp) { P.asp = d.pasp; filterChanged(); return; }
    if ("pallt" in d) { P.tenses = ALL_T.slice(); filterChanged(); return; }
    if ("pfavoff" in d) { P.favOnly = false; filterChanged(); return; }
    if (d.pinput) { P.input = d.pinput; saveFilter(); P.ans = -1; P.typed = ""; renderPractice(); if (P.input === "type") focusAnswer(); return; }
    if ("pcheck" in d) { checkTyped(); return; }
    if (d.ans !== undefined) { answer(+d.ans); return; }
    if ("pnext" in d) { nextQ(); return; }
    if ("popen" in d && P.q && P.q.mode === "forms") {
      S.B.verb = P.q.v; S.B.tense = P.q.tid; S.B.pf = P.q.pf; S.B.person = P.q.i; S.B.neg = false; S.B.ask = false; S.B.pr = ""; S.B.sel = -1; saveB();
      go(function () { S.tab = "form"; }); return;
    }
    // verbs
    if (d.verb) { go(function () { S.tab = "verbs"; S.verb = +d.verb; }); return; }
    if ("back" in d) { go(function () { S.verb = null; }); return; }
    if (d.vperson) { S.vperson = +d.vperson; renderVerbs(); return; }
    if ("vrare" in d) { S.vrare = !S.vrare; renderVerbs(); return; }
    if (d.cell) {
      var c = d.cell.split("|");
      S.B.verb = S.verb; S.B.tense = c[0]; S.B.pf = c[1] === "1"; S.B.person = +c[2]; S.B.neg = false; S.B.ask = false; S.B.pr = ""; S.B.sel = -1; saveB();
      go(function () { S.tab = "form"; }); return;
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { S.query = e.target.value; renderVerbs(); }
    if (e.target.id === "bq") { S.B.q = e.target.value; renderForm(); }
  });
  document.addEventListener("change", function (e) {
    var el = e.target, d = el.dataset || {};
    if (el.id === "elKey" || el.id === "elVoice") {
      store.set(el.id, el.value.trim()); ttsUpdate(); var was = TTS.ok; render(); if (was) { /* buttons may have appeared */ }
      return;
    }
    if (el.classList.contains("trbox")) {
      S.tr = el.checked; store.set("tr", S.tr ? "1" : "0"); document.body.classList.toggle("no-tr", !S.tr);
      Array.prototype.forEach.call(document.querySelectorAll(".trbox"), function (b) { b.checked = S.tr; });
    }
    if ("ptall" in d) { P.tenses = el.checked ? ALL_T.slice() : []; filterChanged(); }
    if ("pfav" in d) { P.favOnly = el.checked; filterChanged(); }
    if (d.pt) {
      P.tenses = el.checked ? P.tenses.concat([d.pt]) : P.tenses.filter(function (x) { return x !== d.pt; });
      P.tenses = ALL_T.filter(function (x) { return P.tenses.indexOf(x) >= 0; });
      filterChanged();
    }
  });
  document.addEventListener("toggle", function (e) {
    var el = e.target;
    if (!el.classList) return;
    if (el.classList.contains("dd")) P.ddOpen = el.open;
  }, true);
  document.addEventListener("keydown", function (e) {
    if (S.tab !== "practice" || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target.id === "pans") {
      if (e.key === "Enter") { e.preventDefault(); if (P.ans < 0) checkTyped(); else nextQ(); }
      return;
    }
    if (/input|textarea|select/i.test(e.target.tagName)) return;
    if (P.ans < 0 && P.input === "choice" && /^[1-4]$/.test(e.key)) { answer(+e.key - 1); e.preventDefault(); }
    else if (P.ans >= 0 && (e.key === "Enter" || e.key === "ArrowRight")) { nextQ(); e.preventDefault(); }
  });
  window.addEventListener("hashchange", function () { readHash(); render(); });

  readHash();
  render();
  initTTS();
})();

</script>

</body>
</html>
