<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глаголи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: header + tabs (top bar on desktop, bottom bar on phones) over one reading column.
   Colour encodes aspect everywhere: blue = imperfective (НСВ), rose = perfective (СВ). */
:root {
  --bg: #F6F5F9;
  --surface: #FFFFFF;
  --sunk: #EEECF3;
  --ink: #1C1A29;
  --muted: #5E5A70;
  --line: #DFDCE7;
  --impf: #1D5F84;
  --impf-soft: #E2EEF5;
  --pf: #B11F4B;
  --pf-soft: #F9E4EB;
  --hl: #FFF0B8;
  --font: "Proxima Nova", "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131B; --surface: #1E1D28; --sunk: #191822; --ink: #ECEAF3; --muted: #A7A3B8; --line: #302E3D;
    --impf: #7DBDE0; --impf-soft: #18303E; --pf: #F27FA1; --pf-soft: #3B1D2A; --hl: #4A4120;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14131B; --surface: #1E1D28; --sunk: #191822; --ink: #ECEAF3; --muted: #A7A3B8; --line: #302E3D;
  --impf: #7DBDE0; --impf-soft: #18303E; --pf: #F27FA1; --pf-soft: #3B1D2A; --hl: #4A4120;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pf); outline-offset: 2px; border-radius: 4px; }
b.i, .i-txt { color: var(--impf); }
b.p, .p-txt { color: var(--pf); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
p { margin: 0; }

/* Header */
header.top { padding-block: 18px 8px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-weight: 700; font-size: 26px; line-height: 1.1; letter-spacing: -.01em; }
.brand h1 span { color: var(--pf); }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); flex: none; }
.lang button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.i { background: var(--impf); }
.dot.p { background: var(--pf); }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; border: 0; background: none; padding: 12px 12px 10px; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pf); }
.tab:disabled { cursor: default; opacity: .45; }
@media (max-width: 640px) {
  nav.tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabs .wrap { justify-content: space-around; padding-inline: 4px; }
  .tab { flex: 1 1 0; font-size: 13px; padding: 12px 4px; border-bottom: 0; border-top: 3px solid transparent; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab[aria-selected="true"] { border-top-color: var(--pf); }
  main { padding-bottom: 90px !important; }
}

main { padding-block: 20px 60px; }
section[role="tabpanel"] { display: grid; gap: 18px; }
h2 { font-weight: 700; font-size: 26px; line-height: 1.2; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h3 { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; }
.lead { margin: 6px 0 0; color: var(--muted); max-width: 65ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-h h3 { margin: 0; }
.ctl-label { font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.badge { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); color: var(--muted); font-style: normal; }
.badge.i { background: var(--impf-soft); color: var(--impf); border-color: transparent; }
.badge.p { background: var(--pf-soft); color: var(--pf); border-color: transparent; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 600; justify-self: start; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.sm { padding: 5px 11px; font-size: 14px; }
.link { border: 0; background: none; padding: 0; color: var(--pf); font-weight: 600; cursor: pointer; justify-self: start; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* Verbs list */
.search-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
#q, #fq { flex: 1 1 260px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; font-size: 16px; }
.count { color: var(--muted); font-size: 14px; }
.vlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 8px; }
.vlist.compact { grid-template-columns: minmax(0, 1fr); }
.vrow { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.vrow:hover { border-color: var(--ink); }
.vrow .pair { font-weight: 700; font-size: 16.5px; grid-column: 1; }
.vrow .vmean { color: var(--muted); font-size: 14px; grid-column: 1; }
.vrow .grp { grid-column: 2; grid-row: 1 / span 2; align-self: center; color: var(--muted); font-size: 12.5px; font-weight: 600; text-align: right; }
.dash { color: var(--muted); }
.empty { color: var(--muted); }

/* Verb page */
.back { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 600; cursor: pointer; justify-self: start; }
.vhead { display: grid; gap: 8px; }
.pairbig { font-size: 30px; line-height: 1.2; }
.vru { color: var(--muted); font-size: 17px; }
.note { background: var(--hl); border-radius: 8px; padding: 8px 12px; font-size: 15px; }
.tsecs { display: grid; gap: 8px; }
.tsec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tsec summary { cursor: pointer; list-style: none; padding: 12px 16px; display: flex; gap: 6px 16px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.tsec summary::-webkit-details-marker { display: none; }
.tsec summary::before { content: "+"; font-weight: 700; color: var(--muted); width: 12px; }
.tsec[open] summary::before { content: "–"; }
.tsum { display: grid; flex: 1 1 220px; min-width: 0; }
.tn { font-weight: 700; }
.tn-bg { font-size: 13px; color: var(--muted); }
.tshort { font-size: 13.5px; color: var(--muted); }
.tprev { font-weight: 700; font-size: 15px; }
.tbody { padding: 0 16px 16px; display: grid; gap: 12px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table.conj { width: 100%; border-collapse: collapse; font-size: 16.5px; }
table.conj th, table.conj td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.conj thead th { font-weight: 700; font-size: 13px; letter-spacing: .03em; }
table.conj thead th.i { color: var(--impf); border-bottom: 2px solid var(--impf); }
table.conj thead th.p { color: var(--pf); border-bottom: 2px solid var(--pf); }
table.conj thead th.who { color: var(--muted); border-bottom: 2px solid var(--line); }
table.conj td.who { color: var(--muted); white-space: nowrap; width: 1%; }
table.conj td.f { font-weight: 600; }
table.conj td.hl { background: var(--hl); }
.aux { font-weight: 400; color: var(--muted); }
.sl { font-weight: 400; color: var(--muted); padding-inline: 2px; }
td.rare { opacity: .55; }
.rare-note { font-weight: 500; color: var(--muted); }
.na { font-weight: 400; font-style: italic; color: var(--muted); font-size: 14px; }
.table-note { font-size: 13.5px; color: var(--muted); }

.aspect-notes { display: grid; gap: 8px; }
.an { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 9px 12px; border-radius: 8px; font-size: 15px; }
.an.i { background: var(--impf-soft); }
.an.p { background: var(--pf-soft); }
.an .tag { font-weight: 700; font-size: 12.5px; }
.an.i .tag { color: var(--impf); }
.an.p .tag { color: var(--pf); }

/* Examples */
.ex-item { display: grid; gap: 2px; padding-left: 12px; border-left: 3px solid var(--line); }
.ex-item .bgt { font-size: 16.5px; }
.ex-item .tr { color: var(--muted); font-size: 14.5px; }
body.no-tr .ex-item .tr { display: none; }
.ex-label { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.tr-toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }

/* Grammar */
.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface); justify-self: start; max-width: 100%; overflow-x: auto; }
.seg { border: 0; background: none; padding: 7px 16px; border-radius: 7px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.timeline { display: grid; grid-template-columns: 1.5fr .8fr 1.4fr; border-top: 3px solid var(--line); position: relative; }
.tl-col { padding: 10px 10px 0 0; display: grid; gap: 8px; align-content: start; position: relative; min-width: 0; }
.tl-col::before { content: ""; position: absolute; top: -8px; left: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 3px solid var(--line); }
.tl-now::before { background: var(--pf); border-color: var(--pf); }
.tl-label { font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-left: 2px; padding-top: 4px; }
.tl-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.moods { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
@media (max-width: 640px) {
  .timeline { grid-template-columns: minmax(0, 1fr); border-top: 0; border-left: 3px solid var(--line); padding-left: 14px; gap: 10px; }
  .tl-col { padding: 0; }
  .tl-col::before { top: 6px; left: -23px; }
}
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 14.5px; font-weight: 500; }
.chip.adv { border-style: dashed; }
.chip[aria-pressed="true"] { border-color: var(--pf); border-style: solid; background: var(--pf-soft); font-weight: 700; }
.detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 18px; min-width: 0; }
.t-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.t-head .tn { font-size: 22px; line-height: 1.25; }
.t-head > .tn, .t-head > .tn-bg { flex-basis: 100%; }
.t-head .badge { order: -1; }
.formula { display: inline-block; justify-self: start; font-weight: 600; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
.verbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.verb-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: 14.5px; }
.verb-btn[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
#modelsel { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 14.5px; max-width: 100%; }
.notes { gap: 18px; }
ul.clean { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.signals { display: flex; flex-wrap: wrap; gap: 6px; }
.sig { background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 14px; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tips li { padding-left: 24px; position: relative; }
.tips li::before { content: "!"; position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.compare { background: var(--hl); border-radius: 8px; padding: 12px 14px; }
.compare h3 { color: var(--ink); }
.card.compare { border-color: transparent; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
.aspect-i { border-top: 4px solid var(--impf); }
.aspect-p { border-top: 4px solid var(--pf); }
.aspect-i h3 { color: var(--impf); }
.aspect-p h3 { color: var(--pf); }
.big-idea { font-weight: 600; font-size: 18px; line-height: 1.35; }
table.plain { width: 100%; border-collapse: collapse; font-size: 15px; }
table.plain th, table.plain td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plain thead th { font-weight: 700; font-size: 13px; color: var(--muted); }
table.plain thead th.i { color: var(--impf); }
table.plain thead th.p { color: var(--pf); }
table.plain td:first-child { font-weight: 600; }
.end b { color: var(--pf); }
.src { font-size: 13.5px; color: var(--muted); }
.p-gap { display: grid; gap: 10px; }

/* Which form */
.fverb { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.fverb .ctl-label { flex-basis: 100%; }
.fverb .pair { font-weight: 700; font-size: 18px; }
.fverb .vmean { color: var(--muted); font-size: 14px; flex: 1 1 auto; }
.picker { gap: 10px; }
.flow { display: grid; gap: 12px; max-width: 780px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; }
.crumb { background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.q { font-weight: 700; font-size: 20px; line-height: 1.3; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.opt:hover { border-color: var(--ink); }
.opt span { color: var(--muted); font-size: 14.5px; }
.res-name { display: grid; }
.res-name .tn { font-size: 22px; }
.why { display: grid; gap: 8px; }

/* Builder */
.builder { gap: 16px; }
.b-verb { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.vpick { border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 10px; align-items: baseline; max-width: 100%; }
.vpick .pair { font-weight: 700; font-size: 18px; }
.chev { color: var(--muted); font-size: 13px; }
.vmean { color: var(--muted); font-size: 14px; }
.picker { display: grid; gap: 8px; }
#bq { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; width: 100%; }
.plist { display: grid; gap: 4px; max-height: 300px; overflow-y: auto; }
.prow { text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 8px 4px; cursor: pointer; display: grid; }
.prow .pair { font-weight: 700; }
.prow:hover { background: var(--sunk); }
.b-tenses { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px 6px 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
.tchip.rare { border-style: dashed; }
.tchip.more { color: var(--muted); padding-left: 10px; font-weight: 500; }
.tchip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.b-ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.pchips { display: flex; flex-wrap: wrap; gap: 4px; }
.pchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 14.5px; font-weight: 600; }
.pchip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.pchip:disabled { opacity: .35; cursor: default; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg2 button { border: 0; background: none; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg2.asp button.i[aria-pressed="true"] { background: var(--impf); color: #fff; }
.seg2.asp button.p[aria-pressed="true"] { background: var(--pf); color: #fff; }
.negbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--muted); }
.negbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.b-out { background: var(--sunk); border-radius: 12px; padding: 18px 16px 14px; display: grid; gap: 8px; justify-items: center; text-align: center; }
.b-pron { color: var(--muted); font-size: 15px; font-weight: 600; }
.b-word { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; font-size: 34px; line-height: 1.25; font-weight: 700; }
.b-word .sp { width: .3em; }
.pc { border: 0; background: none; padding: 0 1px; cursor: pointer; font: inherit; border-bottom: 3px solid transparent; border-radius: 0; }
.pc.k-pt, .pc.k-se { color: var(--muted); font-weight: 500; }
.pc.k-stem.impf, .pc.k-end.impf { color: var(--impf); }
.pc.k-stem.pf, .pc.k-end.pf { color: var(--pf); }
.pc.k-end { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
.pc[aria-pressed="true"] { background: var(--hl); border-radius: 6px; }
.b-info { font-size: 15px; max-width: 46ch; min-height: 2.6em; }
.b-na { font-size: 16px; color: var(--muted); max-width: 40ch; }
.b-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14.5px; }
.b-meta .link { margin-left: auto; }
.b-all { display: grid; gap: 2px; }
.b-all .ctl-label { margin-bottom: 4px; }
.arow { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 8px; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 16px; }
.arow:hover { background: var(--sunk); }
.arow[aria-pressed="true"] { background: var(--sunk); font-weight: 700; }
.arow .who { color: var(--muted); }
.endc { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }

/* Tense icons */
.ticon { width: 42px; height: 12px; flex: none; color: inherit; }
.ticon .l { stroke: currentColor; stroke-width: 1.5; opacity: .35; fill: none; }
.ticon .n { stroke: var(--pf); stroke-width: 2; fill: none; }
.ticon .m { fill: currentColor; }
.ticon .o { fill: none; stroke: currentColor; stroke-width: 1.5; }
.ticon .a { stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ticon .d { stroke-dasharray: 2 2; }
.ticon circle.d { fill: none; stroke: currentColor; stroke-width: 1.6; }
.ticon .w { stroke-width: 2.6; }

/* Tense cards */
