<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глаголи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Literata:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one header row, flat tabs, one content column (two on wide screens).
   Colour: blue = НСВ, orange = СВ — the only accents. Yellow only marks the selected part of a word and changes.
   Type: Onest for the interface, Literata for every Bulgarian word. Spacing 4 / 8 / 16 / 24 / 32, radii 12 / 8. */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --sunk: #EFF1F4;
  --ink: #15171C;
  --muted: #5B606B;
  --line: #E3E6EB;
  --impf: #1F5FBF;
  --impf-soft: #E8EFFB;
  --pf: #B54708;
  --pf-soft: #FBEFE6;
  --on-accent: #FFFFFF;
  --hl: #FFE27A;
  --hl-soft: #FFF4C2;
  --ok: #1E7B4F;
  --bad: #B42318;
  --ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg-font: "Literata", "PT Serif", Georgia, "Times New Roman", serif;
  --t-xs: 12px; --t-s: 14px; --t-m: 16px; --t-l: 20px; --t-xl: 42px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px;
  --r: 12px; --r-s: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1A1D24; --sunk: #232731; --ink: #ECEEF2; --muted: #A3A9B5; --line: #2C313B;
    --impf: #84B3FF; --impf-soft: #1B2A44; --pf: #FFA463; --pf-soft: #3A2517; --on-accent: #111318;
    --hl: #7A6618; --hl-soft: #3A3418; --ok: #5FD39A; --bad: #FF8A7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1A1D24; --sunk: #232731; --ink: #ECEEF2; --muted: #A3A9B5; --line: #2C313B;
  --impf: #84B3FF; --impf-soft: #1B2A44; --pf: #FFA463; --pf-soft: #3A2517; --on-accent: #111318;
  --hl: #7A6618; --hl-soft: #3A3418; --ok: #5FD39A; --bad: #FF8A7A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--ui); font-size: var(--t-m); line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
p, h2, h3, h4 { margin: 0; }
.bg { font-family: var(--bg-font); }
b.i, .i-txt { color: var(--impf); }
b.p, .p-txt { color: var(--pf); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
.muted { color: var(--muted); }
.small { font-size: var(--t-s); }

/* Header */
header.top { padding-block: var(--s3) var(--s2); }
.top-row { display: flex; align-items: center; gap: var(--s2); }
.brand { font-weight: 700; font-size: var(--t-l); letter-spacing: -.01em; min-width: 0; }
.brand small { font-weight: 500; font-size: var(--t-s); color: var(--muted); margin-left: var(--s2); }
.spacer { flex: 1; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--sunk); color: var(--muted); font-size: var(--t-s); font-weight: 600; cursor: pointer; }
.chipbtn .acc { font-family: var(--bg-font); font-size: 17px; line-height: 1; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.help { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--sunk); font-weight: 700; cursor: pointer; flex: none; }
.help[aria-expanded="true"] { background: var(--ink); color: var(--bg); }
.lang { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; flex: none; }
.lang button { border: 0; background: none; min-width: 40px; height: 30px; border-radius: 999px; font-weight: 600; font-size: var(--t-s); cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
@media (max-width: 480px) {
  .brand small, .chipbtn .lbl { display: none; }
  .chipbtn { width: 36px; padding: 0; justify-content: center; }
}
.legend, .notice { margin-top: var(--s2); background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s2); font-size: var(--t-s); }
.notice { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding-block: var(--s2); }
.notice .link { min-height: 36px; text-decoration: none; }
.tts-set { display: grid; gap: var(--s2); padding-top: var(--s2); border-top: 1px solid var(--line); }
.seg.ttsseg { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.seg.ttsseg button { white-space: normal; padding: var(--s1) var(--s2); }
.legend .row { display: flex; gap: var(--s2); align-items: baseline; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.i { background: var(--impf); }
.dot.p { background: var(--pf); }
.dot.h { background: var(--hl); }

/* Tabs: flat and neutral; the active one is underlined */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: var(--s1); }
.tab { display: inline-flex; align-items: center; gap: var(--s2); height: 46px; padding: 0 var(--s3); margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 500; font-size: 15px; cursor: pointer; }
.tab svg { width: 18px; height: 18px; flex: none; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
@media (max-width: 560px) {
  nav.tabs .wrap { gap: 0; }
  .tab { flex: 1 1 0; justify-content: center; padding: 0 4px; font-size: var(--t-s); }
  .tab svg { display: none; }
}

main { padding-block: var(--s4); }
section[role="tabpanel"] { display: grid; gap: var(--s3); scroll-margin-top: 64px; }
h2 { font-size: var(--t-l); font-weight: 700; line-height: 1.25; text-wrap: balance; }
/* section headings: small, sentence case, a little bolder than body text */
.label { font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--ink); }
.panel { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); min-width: 0; align-content: start; }
.link { border: 0; background: none; padding: 0; min-height: 44px; color: var(--ink); font-weight: 600; font-size: var(--t-s); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-decoration-thickness: 2px; text-underline-offset: 4px; justify-self: start; }
.link:hover { text-decoration-color: var(--ink); }
.na { color: var(--muted); font-style: italic; font-size: var(--t-s); }
.aux { color: var(--muted); font-weight: 400; }
.endc { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; text-decoration-skip-ink: none; }
.tts { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; font-size: 17px; line-height: 1; cursor: pointer; flex: none; vertical-align: middle; }
.tts:hover { background: var(--sunk); }
.quote .tts { width: 30px; height: 30px; font-size: 15px; margin-left: 2px; }

/* ---------- Builder ---------- */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: var(--s3); align-items: start; }
.b-col { display: grid; gap: var(--s3); min-width: 0; }
.vwrap { display: grid; gap: var(--s2); min-width: 0; }
@media (max-width: 820px) {
  .builder { grid-template-columns: minmax(0, 1fr); }
  .b-col { display: contents; }
  .vwrap { order: 1; } .ctl { order: 2; } .tpanel { order: 3; } .b-ex { order: 4; }
}
.vpick-row { display: flex; gap: var(--s2); align-items: stretch; }
.vpick-row .star { background: var(--surface); width: 56px; height: auto; border-radius: var(--r); }
.vpick { flex: 1; min-width: 0; width: 100%; display: flex; align-items: center; gap: var(--s2); min-height: 56px; border: 0; background: var(--surface); border-radius: var(--r); padding: var(--s2) var(--s3); cursor: pointer; text-align: left; }
.vpick .txt { display: grid; flex: 1; min-width: 0; }
.vpick .pair { font-family: var(--bg-font); font-weight: 600; font-size: var(--t-l); }
.vpick .vmean { font-size: var(--t-s); color: var(--muted); }
.chev { color: var(--muted); }
.picker { background: var(--surface); border-radius: var(--r); padding: var(--s2); display: grid; gap: var(--s2); }
.pcount { font-size: var(--t-s); color: var(--muted); padding-inline: var(--s2); }
.search { width: 100%; border: 0; background: var(--sunk); border-radius: var(--r-s); padding: 0 var(--s3); height: 48px; font-size: var(--t-m); }
.plist { display: grid; max-height: 360px; overflow-y: auto; }
.prow { text-align: left; border: 0; background: none; padding: var(--s2); min-height: 52px; border-radius: var(--r-s); cursor: pointer; display: grid; }
.prow:hover { background: var(--sunk); }
.prow .pair { font-family: var(--bg-font); font-weight: 600; }
.prow .vmean { font-size: var(--t-s); color: var(--muted); }

.ctl { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: var(--r-s); padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 6px; font-weight: 600; font-size: var(--t-s); color: var(--muted); cursor: pointer; padding: 0 var(--s2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.seg button:disabled { opacity: .35; cursor: default; }
.tlist { display: flex; flex-wrap: wrap; gap: var(--s2); }
.tbtn { display: inline-flex; align-items: center; gap: var(--s2); border: 0; background: var(--sunk); border-radius: 999px; min-height: 44px; padding: 0 var(--s3) 0 var(--s2); cursor: pointer; font-weight: 600; font-size: var(--t-s); }
.tbtn.rare { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.negbtn { border: 0; background: var(--sunk); border-radius: var(--r-s); min-height: 44px; min-width: 56px; font-family: var(--bg-font); font-weight: 600; cursor: pointer; color: var(--muted); }
.negbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* the table panel: tools, the selected form large in the middle, then every person */
.tpanel { gap: 0; padding: var(--s3) var(--s2); }
.t-tools { display: flex; align-items: center; gap: var(--s2); padding-inline: var(--s2); flex-wrap: wrap; }
.t-tools .t-name { display: inline-flex; align-items: center; gap: var(--s2); flex: 1 1 auto; min-width: 0; font-size: var(--t-s); }
.t-tools .seg button { min-height: 36px; min-width: 40px; }
.t-pr { padding-top: var(--s2); }
.t-k { font-size: var(--t-s); color: var(--muted); }
.seg.prseg button.bg { font-family: var(--bg-font); }
.qbtn { font-family: var(--bg-font); }
.t-note { font-size: var(--t-s); color: var(--muted); padding: var(--s3) var(--s2) 0; }
.cl { color: var(--ink); font-weight: 600; }
.b-hero { display: grid; justify-items: center; text-align: center; gap: var(--s2); padding: var(--s5) var(--s3) var(--s4); }
.b-pron { font-size: var(--t-s); font-weight: 600; color: var(--muted); }
.b-wordrow { display: flex; align-items: center; justify-content: center; gap: var(--s1); flex-wrap: wrap; max-width: 100%; }
.b-word { font-family: var(--bg-font); font-size: var(--t-xl); line-height: 1.2; font-weight: 600; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: .28em; min-width: 0; }
.b-word .w { white-space: nowrap; }
.pc { border: 0; background: none; padding: 0 2px; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; transition: background-color .5s ease; }
.pc.k-pt, .pc.k-se, .pc.k-q { color: var(--muted); font-weight: 400; }
.pc.k-cl { color: var(--ink); }
.pc.k-q { cursor: default; padding: 0; margin-left: -.24em; }
.pc.k-stem.impf, .pc.k-end.impf { color: var(--impf); }
.pc.k-stem.pf, .pc.k-end.pf { color: var(--pf); }
.pc.k-end { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; text-decoration-skip-ink: none; }
.pc[aria-pressed="true"] { background: var(--hl-soft); box-shadow: inset 0 -3px 0 var(--hl); }
.pc.chg { animation: chg 1.1s ease-out; }
.b-word.fade { animation: fade .35s ease-out; }
@keyframes chg { 0% { background: var(--hl); } 100% { background: transparent; } }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.b-info { font-size: var(--t-s); color: var(--muted); max-width: 44ch; min-height: 3em; }
.b-na { font-size: var(--t-m); color: var(--muted); max-width: 36ch; }
table.ftable { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.ftable col.cw { width: 3.6em; }
table.ftable.one, table.vgrid.one { max-width: 520px; }
table.ftable thead th { font-size: var(--t-xs); font-weight: 600; text-align: left; padding: var(--s2); border-bottom: 1px solid var(--line); }
table.ftable thead th .bg { font-weight: 600; font-size: var(--t-s); }
table.ftable thead th.i { color: var(--impf); }
table.ftable thead th.p { color: var(--pf); }
table.ftable th.who { font-family: var(--bg-font); font-weight: 400; font-size: var(--t-s); color: var(--muted); text-align: left; padding-left: var(--s2); }
table.ftable td { padding: 2px; }
.fcell { width: 100%; min-height: 46px; border: 0; background: none; border-radius: var(--r-s); text-align: left; padding: 6px var(--s2); font-family: var(--bg-font); font-size: 17px; font-weight: 600; line-height: 1.3; cursor: pointer; transition: background-color .4s ease; }
.fcell:hover { background: var(--sunk); }
.fcell.i { color: var(--impf); }
.fcell.p { color: var(--pf); }
.fcell.empty { color: var(--muted); font-weight: 400; }
.fcell[aria-pressed="true"] { background: var(--sunk); }
.fcell.chg { animation: chg 1.1s ease-out; }
table.ftable.fade tbody { animation: fade .35s ease-out; }
@media (prefers-reduced-motion: reduce) { .pc.chg, .b-word.fade, .fcell.chg, table.ftable.fade tbody { animation: none; } }
.b-meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; font-size: var(--t-s); color: var(--muted); padding: var(--s2) var(--s2) 0; }
.b-meta b { color: var(--ink); }
.b-meta .link { margin-left: auto; }
@media (max-width: 520px) {
  .b-word { font-size: 34px; }
  .b-hero { padding: var(--s4) var(--s2) var(--s3); }
  .fcell { font-size: 16px; padding-inline: 6px; }
  table.ftable col.cw { width: 3.1em; }
}
@media (max-width: 400px) {
  .fcell { font-size: 15px; padding-inline: 4px; overflow-wrap: anywhere; }
  table.ftable col.cw { width: 2.8em; }
}

/* Examples */
.ex { display: grid; gap: var(--s3); }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.quote { display: grid; gap: 2px; padding-left: var(--s3); border-left: 2px solid var(--line); }
.quote .bgt { font-family: var(--bg-font); font-size: 17px; line-height: 1.5; }
.quote .tr { color: var(--muted); font-size: var(--t-s); }
body.no-tr .quote .tr { display: none; }
.trt { display: inline-flex; gap: 6px; align-items: center; font-size: var(--t-s); color: var(--muted); cursor: pointer; min-height: 44px; }

/* Tense icons */
.ticon { width: 44px; height: 13px; flex: none; }
.ticon .l { stroke: currentColor; stroke-width: 1.5; opacity: .3; fill: none; }
.ticon .n { stroke: currentColor; stroke-width: 2; opacity: .55; fill: none; }
.ticon .m { fill: currentColor; }
.ticon .o { fill: none; stroke: currentColor; stroke-width: 1.5; }
.ticon .a { stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ticon .d { stroke-dasharray: 2 2; }
.ticon circle.d { fill: none; stroke: currentColor; stroke-width: 1.6; }
.ticon .w { stroke-width: 2.6; }

/* ---------- Tenses ---------- */
.ttop { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s3); align-items: start; }
@media (max-width: 820px) { .ttop { grid-template-columns: minmax(0, 1fr); } }
.choose { display: grid; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 9.5em; gap: var(--s2); align-items: center; text-align: left; border: 0; background: none; min-height: 48px; padding: var(--s2); border-radius: var(--r-s); cursor: pointer; }
.crow + .crow { border-top: 1px solid var(--line); }
.crow:hover { background: var(--sunk); }
.crow .say { font-size: var(--t-s); }
.crow .ctn { display: inline-flex; gap: var(--s2); align-items: center; font-weight: 600; font-size: var(--t-s); }
.asp { display: grid; gap: var(--s2); }
.aspc { display: grid; gap: 2px; padding: var(--s2) var(--s3); border-radius: var(--r-s); font-size: var(--t-s); }
.aspc.i { background: var(--impf-soft); }
.aspc.p { background: var(--pf-soft); }
.aspc.i b { color: var(--impf); }
.aspc.p b { color: var(--pf); }
.aspc .sigs { font-family: var(--bg-font); color: var(--muted); }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: var(--s3); align-items: start; }
.tcard { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); min-width: 0; scroll-margin-top: 64px; }
.tc-h { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s2) var(--s3); align-items: center; }
.tc-h .ticon { width: 56px; height: 16px; }
.tc-h .tn { font-weight: 700; font-size: 18px; line-height: 1.25; }
.tc-sub { grid-column: 1 / -1; font-size: var(--t-s); color: var(--muted); }
.tc-sub .bg { color: var(--ink); }
.formula { font-size: var(--t-s); color: var(--muted); }
.formula b { color: var(--ink); font-weight: 600; }
.strip-wrap { overflow-x: auto; background: var(--sunk); border-radius: var(--r-s); padding: var(--s2); }
table.strip { border-collapse: collapse; width: 100%; }
table.strip th { font-size: var(--t-xs); font-weight: 600; color: var(--muted); text-align: left; padding: 2px 6px; font-family: var(--bg-font); }
table.strip td { font-family: var(--bg-font); font-weight: 700; font-size: 17px; padding: 4px 6px; white-space: nowrap; }
table.strip td.g { font-family: var(--ui); font-size: var(--t-xs); font-weight: 600; color: var(--muted); }
.after { font-size: var(--t-s); color: var(--muted); }
.tc-links { display: flex; gap: var(--s4); flex-wrap: wrap; }
.tsolo { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
.tgroup { display: grid; gap: var(--s1); }
#tpick { gap: var(--s2); }
.tc-more { display: grid; gap: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); }
.tc-more .label { margin-bottom: var(--s1); }
ul.clean { margin: 0; padding-left: 18px; display: grid; gap: var(--s1); font-size: var(--t-s); }
.signals { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); font-family: var(--bg-font); }
.sig { background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: var(--t-s); }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); font-size: var(--t-s); }
.tips li { padding-left: 16px; position: relative; }
.tips li::before { content: "–"; position: absolute; left: 0; color: var(--muted); }
.compare { background: var(--sunk); border-radius: var(--r-s); padding: var(--s2) var(--s3); font-size: var(--t-s); display: grid; gap: var(--s1); }
.stems > summary { list-style: none; cursor: pointer; }
.stems > summary::-webkit-details-marker { display: none; }
.stems > summary .label::after { content: " ▾"; color: var(--muted); }
table.plain { width: 100%; border-collapse: collapse; font-size: var(--t-s); }
table.plain td { padding: var(--s2) 6px; vertical-align: top; border-bottom: 1px solid var(--line); }
table.plain td:first-child { font-weight: 600; white-space: nowrap; }

/* ---------- Verbs ---------- */
