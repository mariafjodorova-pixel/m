<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Глаголи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Literata:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one compact header row; content column; bottom tab bar on phones.
   Builder: result pinned on top, controls below (thumb zone).
   Colour: blue = НСВ, orange = СВ — used for aspect only. UI accent is neutral ink; yellow = selection / change.
   Type: Onest for the interface, Literata for every Bulgarian word. Scale 12 / 14 / 16 / 20 / 34. */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --sunk: #EEF0F4;
  --ink: #15171C;
  --muted: #5B606B;
  --line: #E2E5EA;
  --impf: #1F5FBF;
  --impf-soft: #E6EEFB;
  --pf: #B54708;
  --pf-soft: #FCEEE4;
  --on-accent: #FFFFFF;
  --hl: #FFE27A;
  --hl-soft: #FFF5CC;
  --tab-form: #F3DF8E; --tab-tenses: #C4E3D2; --tab-verbs: #D9D0F2; --tab-practice: #F4C9D2;
  --ok: #1E7B4F; --ok-soft: #E3F4EA; --bad: #B42318; --bad-soft: #FBE9E7;
  --ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg-font: "Literata", "PT Serif", Georgia, "Times New Roman", serif;
  --t-xs: 12px; --t-s: 14px; --t-m: 16px; --t-l: 20px; --t-xl: 34px;
  --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px;
  --r: 14px; --r-s: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1A1D24; --sunk: #232731; --ink: #ECEEF2; --muted: #A3A9B5; --line: #2C313B;
    --impf: #84B3FF; --impf-soft: #1B2A44; --pf: #FFA463; --pf-soft: #3A2517; --on-accent: #111318;
    --hl: #7A6618; --hl-soft: #3A3418; --tab-form: #5C5023; --tab-tenses: #284437; --tab-verbs: #3B3458; --tab-practice: #55303A; --ok: #5FD39A; --ok-soft: #173426; --bad: #FF8A7A; --bad-soft: #3D1C18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1A1D24; --sunk: #232731; --ink: #ECEEF2; --muted: #A3A9B5; --line: #2C313B;
  --impf: #84B3FF; --impf-soft: #1B2A44; --pf: #FFA463; --pf-soft: #3A2517; --on-accent: #111318;
  --hl: #7A6618; --hl-soft: #3A3418; --tab-form: #5C5023; --tab-tenses: #284437; --tab-verbs: #3B3458; --tab-practice: #55303A; --ok: #5FD39A; --ok-soft: #173426; --bad: #FF8A7A; --bad-soft: #3D1C18;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--ui); font-size: var(--t-m); line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
p { margin: 0; }
.bg { font-family: var(--bg-font); }
b.i, .i-txt { color: var(--impf); }
b.p, .p-txt { color: var(--pf); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }

/* Header: one row */
header.top { padding-block: 12px; }
.top-row { display: flex; align-items: center; gap: var(--s2); }
.brand { font-weight: 700; font-size: var(--t-l); letter-spacing: -.01em; margin: 0; }
.brand .bg { font-weight: 700; }
.brand small { font-weight: 500; font-size: var(--t-s); color: var(--muted); margin-left: var(--s2); }
.spacer { flex: 1; }
.help { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--sunk); font-weight: 700; cursor: pointer; }
.help[aria-expanded="true"] { background: var(--ink); color: var(--bg); }
.lang { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: none; min-width: 44px; height: 32px; border-radius: 999px; font-weight: 600; font-size: var(--t-s); cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.legend { margin-top: var(--s2); background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s2); font-size: var(--t-s); }
.legend .row { display: flex; gap: var(--s2); align-items: baseline; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.i { background: var(--impf); }
.dot.p { background: var(--pf); }
.dot.h { background: var(--hl); }

/* Tabs: notebook dividers. Each tab is a coloured trapezoid; the active one sits in front
   and merges with the coloured page edge (border-bottom of the nav). */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-top: var(--s2); border-bottom: 6px solid var(--active-tab, var(--tab-form)); }
nav.tabs .wrap { display: flex; align-items: flex-end; padding-left: 24px; }
.tab { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: var(--s2); border: 0; background: none; height: 42px; margin-right: -10px; padding: 0 26px; font-weight: 600; font-size: var(--t-s); color: var(--ink); cursor: pointer; transform: translateY(5px); transition: transform .15s ease; }
.tab::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--tc); border-radius: 10px 10px 0 0; transform: perspective(70px) rotateX(9deg); transform-origin: bottom; box-shadow: inset 0 -7px 8px -6px rgba(0,0,0,.22), 0 -1px 2px rgba(0,0,0,.08); filter: saturate(.8) brightness(.96); }
.tab svg { width: 18px; height: 18px; flex: none; opacity: .75; }
.tab:hover { transform: translateY(2px); }
.tab[aria-selected="true"] { z-index: 6; transform: none; font-weight: 700; }
.tab[aria-selected="true"]::before { filter: none; box-shadow: 0 -2px 4px rgba(0,0,0,.08); }
.tab[aria-selected="true"] svg { opacity: 1; }
@media (max-width: 560px) {
  nav.tabs .wrap { padding-left: 10px; padding-right: 10px; }
  .tab { flex: 1 1 0; justify-content: center; padding: 0 6px; margin-right: -6px; font-size: 13px; }
  .tab svg { display: none; }
}

main { padding-block: var(--s3) var(--s4); }
section[role="tabpanel"] { display: grid; gap: var(--s3); scroll-margin-top: 72px; }
h2 { font-size: var(--t-l); font-weight: 700; margin: 0; line-height: 1.25; text-wrap: balance; }
.label { font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); min-width: 0; align-content: start; }
.link { border: 0; background: none; padding: 0; min-height: 44px; color: var(--ink); font-weight: 600; font-size: var(--t-s); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-decoration-thickness: 2px; text-underline-offset: 4px; justify-self: start; }
.link:hover { text-decoration-color: var(--ink); }
.muted { color: var(--muted); }
.na { color: var(--muted); font-style: italic; font-size: var(--t-s); }
.aux { color: var(--muted); font-weight: 400; }
.endc { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-skip-ink: none; }

/* ---------- Builder ---------- */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: var(--s3); align-items: start; }
.b-col { display: grid; gap: var(--s3); min-width: 0; }
.vwrap { display: grid; gap: var(--s2); min-width: 0; }
@media (max-width: 820px) {
  .builder { grid-template-columns: minmax(0, 1fr); }
  .b-col { display: contents; }
  .vwrap { order: 1; } .ctl { order: 2; } .tpanel { order: 3; } .b-ex { order: 4; }
}
/* the main table */
.tpanel { gap: var(--s2); padding-inline: var(--s2); }
.t-tools { display: flex; align-items: center; gap: var(--s2); padding-inline: var(--s2); flex-wrap: wrap; }
.t-tools .t-name { display: inline-flex; align-items: center; gap: var(--s2); flex: 1 1 auto; min-width: 0; font-size: var(--t-s); }
.t-tools .seg button { min-height: 36px; min-width: 40px; }
.t-tools .negbtn { min-height: 42px; }
table.ftable { width: 100%; border-collapse: separate; border-spacing: 0 2px; table-layout: fixed; }
table.ftable col.cw { width: 3.6em; }
table.ftable thead th { font-size: var(--t-xs); font-weight: 700; text-align: left; padding: var(--s1) var(--s2); }
table.ftable thead th .bg { font-weight: 600; font-size: var(--t-s); }
table.ftable thead th.i { color: var(--impf); }
table.ftable thead th.p { color: var(--pf); }
table.ftable th.who { font-family: var(--bg-font); font-weight: 400; font-size: var(--t-s); color: var(--muted); text-align: left; padding-left: var(--s2); }
table.ftable td { padding: 0 2px; }
.fcell { width: 100%; min-height: 48px; border: 0; background: none; border-radius: var(--r-s); text-align: left; padding: 6px var(--s2); font-family: var(--bg-font); font-size: 17px; font-weight: 600; line-height: 1.3; cursor: pointer; transition: background-color .4s ease; }
.fcell:hover { background: var(--sunk); }
.fcell.i { color: var(--impf); }
.fcell.p { color: var(--pf); }
.fcell.empty { color: var(--muted); font-weight: 400; }
.fcell[aria-pressed="true"] { background: var(--hl-soft); box-shadow: inset 0 0 0 2px var(--hl); }
.fcell.chg { animation: chg 1.1s ease-out; }
table.ftable.fade tbody { animation: fade .35s ease-out; }
@media (prefers-reduced-motion: reduce) { .fcell.chg, table.ftable.fade tbody { animation: none; } }
.tpanel .b-meta { padding-inline: var(--s2); }
tr.drow td { padding: 2px 2px var(--s2); }
.b-detail { display: grid; justify-items: center; text-align: center; gap: var(--s1); background: var(--hl-soft); border-radius: var(--r-s); padding: var(--s3) var(--s2); }
.b-detail .b-word { font-size: 30px; }
.b-detail .b-info { min-height: 0; }
.b-detail .pc[aria-pressed="true"] { background: var(--surface); }
@media (max-width: 520px) { .fcell { font-size: 16px; padding-inline: 6px; } table.ftable col.cw { width: 3.1em; } }
.b-result { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s2); justify-items: center; text-align: center; min-height: 168px; align-content: center; }
.b-pron { font-size: var(--t-s); font-weight: 600; color: var(--muted); }
.b-word { font-family: var(--bg-font); font-size: var(--t-xl); line-height: 1.2; font-weight: 600; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: .28em; }
.b-word .w { white-space: nowrap; }
.pc { border: 0; background: none; padding: 0 2px; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; transition: background-color .5s ease; }
.pc.k-pt, .pc.k-se { color: var(--muted); font-weight: 400; }
.pc.k-stem.impf, .pc.k-end.impf { color: var(--impf); }
.pc.k-stem.pf, .pc.k-end.pf { color: var(--pf); }
.pc.k-end { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 7px; text-decoration-skip-ink: none; }
.pc[aria-pressed="true"] { background: var(--hl-soft); box-shadow: inset 0 -2px 0 var(--hl); }
.pc.chg { animation: chg 1.1s ease-out; }
.b-word.fade { animation: fade .35s ease-out; }
@keyframes chg { 0% { background: var(--hl); } 100% { background: transparent; } }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pc.chg, .b-word.fade { animation: none; } }
.b-info { font-size: var(--t-s); color: var(--ink); max-width: 44ch; min-height: 3em; }
.b-na { font-size: var(--t-m); color: var(--muted); max-width: 36ch; }
.b-meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; font-size: var(--t-s); color: var(--muted); }
.b-meta b { color: var(--ink); }
.b-meta .link { margin-left: auto; }

.vpick { width: 100%; display: flex; align-items: center; gap: var(--s2); min-height: 56px; border: 0; background: var(--surface); border-radius: var(--r); padding: var(--s2) var(--s3); cursor: pointer; text-align: left; }
.vpick .txt { display: grid; flex: 1; min-width: 0; }
.vpick .pair { font-family: var(--bg-font); font-weight: 600; font-size: var(--t-l); }
.vpick .vmean { font-size: var(--t-s); color: var(--muted); }
.chev { color: var(--muted); }
.picker { background: var(--surface); border-radius: var(--r); padding: var(--s2); display: grid; gap: var(--s2); }
.search { width: 100%; border: 0; background: var(--sunk); border-radius: var(--r-s); padding: 0 var(--s3); height: 48px; font-size: var(--t-m); }
.plist { display: grid; max-height: 320px; overflow-y: auto; }
.prow { text-align: left; border: 0; background: none; padding: var(--s2) var(--s2); min-height: 52px; border-radius: var(--r-s); cursor: pointer; display: grid; }
.prow:hover { background: var(--sunk); }
.prow .pair { font-family: var(--bg-font); font-weight: 600; }
.prow .vmean { font-size: var(--t-s); color: var(--muted); }

.ctl { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border-radius: var(--r-s); padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; min-height: 40px; border-radius: 8px; font-weight: 600; font-size: var(--t-s); color: var(--muted); cursor: pointer; padding: 0 var(--s2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.seg button:disabled { opacity: .35; cursor: default; }
.seg.asp button.i[aria-pressed="true"] { background: var(--impf); color: var(--on-accent); }
.seg.asp button.p[aria-pressed="true"] { background: var(--pf); color: var(--on-accent); }
.tlist { display: flex; flex-wrap: wrap; gap: var(--s2); }
.tbtn { display: inline-flex; align-items: center; gap: var(--s2); border: 0; background: var(--sunk); border-radius: 999px; min-height: 44px; padding: 0 var(--s3) 0 var(--s2); cursor: pointer; font-weight: 600; font-size: var(--t-s); }
.tbtn.rare { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.persons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2) var(--s2); }
.persons .label { text-align: center; }
.pbtn { border: 0; background: var(--sunk); border-radius: var(--r-s); min-height: 44px; font-family: var(--bg-font); font-weight: 600; font-size: var(--t-m); cursor: pointer; }
.pbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pbtn:disabled { opacity: .3; cursor: default; }
.togs { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: var(--s2); }
.negbtn { border: 0; background: var(--sunk); border-radius: var(--r-s); min-height: 46px; min-width: 64px; font-family: var(--bg-font); font-weight: 600; cursor: pointer; color: var(--muted); }
.negbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.all { background: var(--surface); border-radius: var(--r); padding: var(--s2) var(--s3) var(--s3); display: grid; }
.all .label { padding: var(--s2) 0; }
.arow { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: var(--s2); text-align: left; border: 0; background: none; min-height: 44px; align-items: center; padding: 0 var(--s2); border-radius: var(--r-s); cursor: pointer; }
.arow:hover { background: var(--sunk); }
.arow[aria-pressed="true"] { background: var(--hl-soft); box-shadow: none; }
.arow .who { color: var(--muted); font-size: var(--t-s); font-family: var(--bg-font); }
.arow .fm { font-family: var(--bg-font); font-size: var(--t-m); font-weight: 600; }

/* Examples */
.ex { display: grid; gap: var(--s3); }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.quote { display: grid; gap: 2px; padding-left: var(--s3); border-left: 3px solid var(--line); }
.quote .bgt { font-family: var(--bg-font); font-size: 17px; line-height: 1.45; }
.quote .tr { color: var(--muted); font-size: var(--t-s); }
body.no-tr .quote .tr { display: none; }
.trt { display: inline-flex; gap: 6px; align-items: center; font-size: var(--t-s); color: var(--muted); cursor: pointer; min-height: 44px; }

/* Tense icons */
.ticon { width: 44px; height: 13px; flex: none; }
.ticon .l { stroke: currentColor; stroke-width: 1.5; opacity: .3; fill: none; }
.ticon .n { stroke: currentColor; stroke-width: 2; opacity: .55; fill: none; }
.ticon .m { fill: currentColor; }
.ticon .o { fill: none; stroke: currentColor; stroke-width: 1.5; }
.ticon .a { stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ticon .d { stroke-dasharray: 2 2; }
.ticon circle.d { fill: none; stroke: currentColor; stroke-width: 1.6; }
.ticon .w { stroke-width: 2.6; }

/* ---------- Tenses ---------- */
.ttop { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s3); align-items: start; }
@media (max-width: 820px) { .ttop { grid-template-columns: minmax(0, 1fr); } }
.choose { display: grid; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 9.5em; gap: var(--s2); align-items: center; text-align: left; border: 0; background: none; min-height: 52px; padding: var(--s2) var(--s2); border-radius: var(--r-s); cursor: pointer; }
.crow + .crow { box-shadow: inset 0 1px 0 var(--line); }
.crow:hover { background: var(--sunk); }
.crow .say { font-size: var(--t-s); }
.crow .ctn { display: inline-flex; gap: var(--s2); align-items: center; font-weight: 600; font-size: var(--t-s); }
.asp { display: grid; gap: var(--s2); }
.aspc { display: grid; gap: 2px; padding: var(--s2) var(--s3); border-radius: var(--r-s); font-size: var(--t-s); }
.aspc.i { background: var(--impf-soft); }
.aspc.p { background: var(--pf-soft); }
.aspc b { font-size: var(--t-s); }
.aspc.i b { color: var(--impf); }
.aspc.p b { color: var(--pf); }
.aspc .sigs { font-family: var(--bg-font); color: var(--muted); }
.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: var(--s3); align-items: start; }
.tcard { background: var(--surface); border-radius: var(--r); padding: var(--s3); display: grid; gap: var(--s3); min-width: 0; scroll-margin-top: 64px; }
.tc-h { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s2) var(--s3); align-items: center; }
.tc-h .ticon { width: 64px; height: 19px; }
.tc-h .tn { font-weight: 700; font-size: var(--t-l); line-height: 1.2; }
.tc-sub { grid-column: 1 / -1; font-size: var(--t-s); color: var(--muted); }
.tc-sub .bg { color: var(--ink); }
.formula { font-size: var(--t-s); color: var(--muted); }
.formula b { color: var(--ink); font-weight: 600; }
.strip-wrap { overflow-x: auto; background: var(--sunk); border-radius: var(--r-s); padding: var(--s2) var(--s2); }
table.strip { border-collapse: collapse; width: 100%; }
table.strip th { font-size: var(--t-xs); font-weight: 600; color: var(--muted); text-align: left; padding: 2px 6px; font-family: var(--bg-font); }
table.strip td { font-family: var(--bg-font); font-weight: 700; font-size: 17px; padding: 4px 6px; white-space: nowrap; }
table.strip td.g { font-family: var(--ui); font-size: var(--t-xs); font-weight: 600; color: var(--muted); }
.after { font-size: var(--t-s); color: var(--muted); }
.tc-links { display: flex; gap: var(--s4); flex-wrap: wrap; }
.tc-more { display: grid; gap: var(--s3); padding-top: var(--s3); box-shadow: inset 0 1px 0 var(--line); }
ul.clean { margin: 0; padding-left: 18px; display: grid; gap: var(--s1); font-size: var(--t-s); }
.signals { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); font-family: var(--bg-font); }
.sig { background: var(--sunk); border-radius: 999px; padding: 2px 10px; font-size: var(--t-s); }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); font-size: var(--t-s); }
.tips li { padding-left: 22px; position: relative; }
.tips li::before { content: "!"; position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--hl); color: var(--ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; line-height: 1; }

.badge.i { background: var(--impf-soft); color: var(--impf); }

/* ---------- Practice ---------- */
.pr { display: grid; gap: var(--s3); max-width: 720px; }
