<title>Глаголи Verb Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Sofia+Sans+Extra+Condensed:wght@700;800&family=Sofia+Sans+Semi+Condensed:wght@500;600&display=swap">
<style>
/* Layout: sticky tab bar over a single reading column; the tense view splits into notes | conjugation table on wide screens.
   Colour encodes aspect everywhere: blue = imperfective (process), rose = perfective (completed). */
:root {
  --bg: #F6F5F9;
  --surface: #FFFFFF;
  --sunk: #EEECF3;
  --ink: #1C1A29;
  --muted: #5E5A70;
  --line: #DFDCE7;
  --impf: #1D5F84;
  --impf-soft: #E2EEF5;
  --pf: #B11F4B;
  --pf-soft: #F9E4EB;
  --display: "Sofia Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Sofia Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond: "Sofia Sans Semi Condensed", "Sofia Sans", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14131B; --surface: #1E1D28; --sunk: #191822; --ink: #ECEAF3; --muted: #A7A3B8; --line: #302E3D;
    --impf: #7DBDE0; --impf-soft: #18303E; --pf: #F27FA1; --pf-soft: #3B1D2A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14131B; --surface: #1E1D28; --sunk: #191822; --ink: #ECEAF3; --muted: #A7A3B8; --line: #302E3D;
  --impf: #7DBDE0; --impf-soft: #18303E; --pf: #F27FA1; --pf-soft: #3B1D2A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pf); outline-offset: 2px; border-radius: 4px; }
b.i, .i-txt { color: var(--impf); }
b.p, .p-txt { color: var(--pf); }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }

/* Header */
header.top { padding-block: 22px 6px; }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 46px; line-height: .95; letter-spacing: .01em; text-transform: uppercase; }
.brand h1 span { color: var(--pf); }
.brand p { margin: 0; color: var(--muted); font-size: 15px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.i { background: var(--impf); }
.dot.p { background: var(--pf); }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs .wrap::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 12px 12px 10px; font-family: var(--cond); font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pf); }
.tab .bg { font-weight: 500; opacity: .7; margin-left: 4px; }
.tab.soon { cursor: default; opacity: .5; }

main { padding-block: 22px 60px; }
section[role="tabpanel"] { display: grid; gap: 22px; }

h2 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h3 { font-family: var(--cond); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.lead { margin: 6px 0 0; color: var(--muted); max-width: 65ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }

/* Controls */
.controls { display: grid; gap: 14px; }
.ctl-label { font-family: var(--cond); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.verbs { display: flex; flex-wrap: wrap; gap: 6px; }
.verb-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 15px; }
.verb-btn small { color: var(--muted); margin-left: 4px; }
.verb-btn[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.verb-btn[aria-pressed="true"] small { color: inherit; opacity: .7; }

.tense-groups { display: flex; gap: 10px 18px; flex-wrap: wrap; }
.tg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tg-name { font-family: var(--cond); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 100%; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 14.5px; }
.chip[aria-pressed="true"] { border-color: var(--pf); background: var(--pf-soft); color: var(--ink); font-weight: 700; }

/* Tense detail */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.t-head { display: grid; gap: 6px; }
.t-head .bgname { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; text-transform: uppercase; text-wrap: balance; }
.t-head .enname { font-size: 18px; font-weight: 500; }
.formula { display: inline-block; justify-self: start; font-family: var(--cond); font-weight: 600; font-size: 15px; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
.notes { display: grid; gap: 18px; }
ul.clean { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.aspect-notes { display: grid; gap: 8px; }
.an { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 10px 12px; border-radius: 8px; }
.an.i { background: var(--impf-soft); }
.an.p { background: var(--pf-soft); }
.an .tag { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.an.i .tag { color: var(--impf); }
.an.p .tag { color: var(--pf); }
.signals { display: flex; flex-wrap: wrap; gap: 6px; }
.sig { background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 14px; }
.tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tips li { padding-left: 22px; position: relative; }
.tips li::before { content: "!"; position: absolute; left: 0; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 700; display: grid; place-items: center; line-height: 1; }

.table-wrap { overflow-x: auto; }
table.conj { width: 100%; border-collapse: collapse; font-size: 16px; }
table.conj th, table.conj td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.conj thead th { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
table.conj thead th.i { color: var(--impf); border-bottom: 2px solid var(--impf); }
table.conj thead th.p { color: var(--pf); border-bottom: 2px solid var(--pf); }
table.conj thead th.who { color: var(--muted); border-bottom: 2px solid var(--line); }
table.conj td.who { color: var(--muted); white-space: nowrap; width: 1%; }
table.conj td.f { font-weight: 700; }
.aux { font-weight: 400; color: var(--muted); }
.sl { font-weight: 400; color: var(--muted); padding-inline: 2px; }
td.rare, th .rare-note { opacity: .5; }
th .rare-note { font-weight: 500; text-transform: none; letter-spacing: 0; margin-left: 4px; }
.na { font-weight: 400; font-style: italic; color: var(--muted); }
.table-note { font-size: 13.5px; color: var(--muted); margin: 8px 0 0; }

.ex { display: grid; gap: 10px; }
.ex-item { display: grid; gap: 1px; padding-left: 12px; border-left: 3px solid var(--line); }
.ex-item .bgt { font-size: 17px; }
.ex-item .ent { color: var(--muted); font-size: 14.5px; }
.ex-item.neg { border-left-color: var(--muted); }
.ex-label { font-family: var(--cond); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Glance table */
table.glance { width: 100%; border-collapse: collapse; font-size: 15px; }
table.glance th, table.glance td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.glance thead th { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.glance tbody tr { cursor: pointer; }
table.glance tbody tr:hover { background: var(--sunk); }
table.glance tbody tr.cur { background: var(--pf-soft); }
table.glance .gname { font-weight: 700; }
table.glance .gname small { display: block; font-weight: 400; color: var(--muted); }
table.glance td.gi { color: var(--impf); font-weight: 600; white-space: nowrap; }
table.glance td.gp { color: var(--pf); font-weight: 600; white-space: nowrap; }
table.glance td.gu { color: var(--muted); min-width: 180px; }

/* Choose */
.flow { display: grid; gap: 14px; max-width: 760px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; }
.crumb { background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.q { font-family: var(--cond); font-weight: 600; font-size: 22px; line-height: 1.25; margin: 0 0 12px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.opt:hover { border-color: var(--ink); }
.opt strong { font-weight: 700; }
.opt span { color: var(--muted); font-size: 14.5px; }
.result .bgname { font-family: var(--display); font-weight: 800; font-size: 34px; text-transform: uppercase; line-height: 1; }
.result { display: grid; gap: 10px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }

/* Aspect & endings */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
.aspect-i { border-top: 4px solid var(--impf); }
.aspect-p { border-top: 4px solid var(--pf); }
.aspect-i h3 { color: var(--impf); }
.aspect-p h3 { color: var(--pf); }
.big-idea { font-family: var(--cond); font-weight: 600; font-size: 20px; line-height: 1.3; margin: 0 0 8px; }
table.plain { width: 100%; border-collapse: collapse; font-size: 15px; }
table.plain th, table.plain td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plain thead th { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.plain thead th.i { color: var(--impf); }
table.plain thead th.p { color: var(--pf); }
table.plain td:first-child { font-weight: 600; }
.end b { color: var(--pf); }
.src { font-size: 13px; color: var(--muted); }
.stack { display: grid; gap: 12px; }
p { margin: 0; }
.p-gap { display: grid; gap: 10px; }

footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
@media (max-width: 520px) {
  .brand h1 { font-size: 40px; }
  .t-head .bgname { font-size: 32px; }
  table.conj th, table.conj td { padding: 7px 6px; }
  .card { padding: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .detail, .flow .card { animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: .4; } to { opacity: 1; } }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1 lang="bg">Глаго<span>ли</span></h1>
      <p>Bulgarian verb times: forms, endings and when to use each one</p>
    </div>
    <div class="legend">
      <span><i class="dot i"></i>imperfective <span lang="bg">(несвършен вид)</span>: process, habit</span>
      <span><i class="dot p"></i>perfective <span lang="bg">(свършен вид)</span>: one finished action</span>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="tab-btn-tenses" data-tab="tenses">Tenses<span class="bg" lang="bg">времена</span></button>
    <button class="tab" role="tab" id="tab-btn-choose" data-tab="choose">Which tense?</button>
    <button class="tab" role="tab" id="tab-btn-aspect" data-tab="aspect">Which aspect?<span class="bg" lang="bg">вид</span></button>
    <button class="tab" role="tab" id="tab-btn-endings" data-tab="endings">Endings<span class="bg" lang="bg">окончания</span></button>
    <button class="tab soon" disabled title="Coming next">Verb pairs · soon</button>
  </div>
</nav>

<main class="wrap">
  <section role="tabpanel" id="tenses" aria-labelledby="tab-btn-tenses"></section>
  <section role="tabpanel" id="choose" aria-labelledby="tab-btn-choose" hidden></section>
  <section role="tabpanel" id="aspect" aria-labelledby="tab-btn-aspect" hidden></section>
  <section role="tabpanel" id="endings" aria-labelledby="tab-btn-endings" hidden></section>
</main>

<footer class="wrap">Personal study app. Tables show standard literary forms. Irregular verbs differ, so check the Endings tab.</footer>

<script>
(function () {
  "use strict";

  /* ---------- Model verbs ---------- */
  var PERSONS = ["аз", "ти", "той / тя", "ние", "вие", "те"];
  var AUX = ["съм", "си", "е", "сме", "сте", "са"];
  var BYAH = ["бях", "беше", "беше", "бяхме", "бяхте", "бяха"];
  var SHTYAH = ["щях", "щеше", "щеше", "щяхме", "щяхте", "щяха"];
  var BIH = ["бих", "би", "би", "бихме", "бихте", "биха"];

  function prefixed(p, v) {
    function m(a) { return a.map(function (f) { return p + f; }); }
    return {
      inf: p + v.inf, pres: m(v.pres), aor: m(v.aor), imp: m(v.imp),
      part: { m: p + v.part.m, f: p + v.part.f, n: p + v.part.n, pl: p + v.part.pl },
      impv: m(v.impv)
    };
  }

  var cheta = {
    inf: "чета", pres: ["чета", "четеш", "чете", "четем", "четете", "четат"],
    aor: ["четох", "чете", "чете", "четохме", "четохте", "четоха"],
    imp: ["четях", "четеше", "четеше", "четяхме", "четяхте", "четяха"],
    part: { m: "чел", f: "чела", n: "чело", pl: "чели" }, impv: ["чети", "четете"]
  };
  var pravya = {
    inf: "правя", pres: ["правя", "правиш", "прави", "правим", "правите", "правят"],
    aor: ["правих", "прави", "прави", "правихме", "правихте", "правиха"],
    imp: ["правех", "правеше", "правеше", "правехме", "правехте", "правеха"],
    part: { m: "правил", f: "правила", n: "правило", pl: "правили" }, impv: ["прави", "правете"]
  };
  var pitam = {
    inf: "питам", pres: ["питам", "питаш", "пита", "питаме", "питате", "питат"],
    aor: ["питах", "пита", "пита", "питахме", "питахте", "питаха"],
    imp: ["питах", "питаше", "питаше", "питахме", "питахте", "питаха"],
    part: { m: "питал", f: "питала", n: "питало", pl: "питали" }, impv: ["питай", "питайте"]
  };
  var vzemam = {
    inf: "вземам", pres: ["вземам", "вземаш", "взема", "вземаме", "вземате", "вземат"],
    aor: ["вземах", "взема", "взема", "вземахме", "вземахте", "вземаха"],
    imp: ["вземах", "вземаше", "вземаше", "вземахме", "вземахте", "вземаха"],
    part: { m: "вземал", f: "вземала", n: "вземало", pl: "вземали" }, impv: ["вземай", "вземайте"]
  };
  var vzema = {
    inf: "взема", pres: ["взема", "вземеш", "вземе", "вземем", "вземете", "вземат"],
    aor: ["взех", "взе", "взе", "взехме", "взехте", "взеха"],
    imp: ["вземех", "вземеше", "вземеше", "вземехме", "вземехте", "вземеха"],
    part: { m: "взел", f: "взела", n: "взело", pl: "взели" }, impv: ["вземи", "вземете"]
  };

  var VERBS = [
    { id: "cheta", en: "read", impf: cheta, pf: prefixed("про", cheta), gi: "I", gp: "I",
      note: "Prefix pair: про- makes it perfective. Both verbs are group I (-еш)." },
    { id: "pravya", en: "do, make", impf: pravya, pf: prefixed("на", pravya), gi: "II", gp: "II",
      note: "Prefix pair: на- makes it perfective. Both verbs are group II (-иш)." },
    { id: "pitam", en: "ask", impf: pitam, pf: prefixed("по", pitam), gi: "III", gp: "III",
      note: "Prefix pair: по- makes it perfective. Both verbs are group III (-аш)." },
    { id: "vzemam", en: "take", impf: vzemam, pf: vzema, gi: "III", gp: "I",
      note: "Suffix pair from your list: вземам (group III) / да взема, -еш (group I). Watch out: той взема (he takes) looks like аз взема (I take, perfective)." }
  ];

  /* ---------- Tenses ---------- */
  function aux(s) { return '<span class="aux">' + s + '</span>'; }
  function part(v, i) { return i < 3 ? v.part.m + '<span class="sl">/</span>' + v.part.f : v.part.pl; }

  var TENSES = [
    {
      id: "present", group: "Present", en: "Present", bg: "Сегашно време",
      formula: "stem + present ending", short: "now, habits, facts",
      cells: function (v, pf) { return v.pres.map(function (f) { return pf ? aux("(да)") + " " + f : f; }); },
      pfNote: "only after да, ще, ако…",
      uses: [
        "Something happening right now. Bulgarian has no separate “-ing” form: <i lang=\"bg\">чета</i> = I read / I am reading.",
        "Habits and repeated actions.",
        "General facts.",
        "Planned near future, like English: <i lang=\"bg\">Утре заминавам.</i> (I'm leaving tomorrow.)"
      ],
      aspect: {
        i: "The normal present tense.",
        p: "Never on its own. Use it only after <i lang=\"bg\">да, ще, ако, когато, щом, преди да</i>: <i lang=\"bg\">Искам да прочета…</i>"
      },
      signals: ["сега", "всеки ден", "обикновено", "винаги", "често", "рядко", "никога"],
      examples: [
        ["Какво правиш? – <b class=\"i\">Чета</b> книга.", "What are you doing? – I'm reading a book."],
        ["Обикновено <b class=\"i\">вземам</b> автобус.", "I usually take the bus."],
        ["Искам да <b class=\"p\">прочета</b> тази книга до неделя.", "I want to read (finish) this book by Sunday."]
      ],
      neg: ["Не <b class=\"i\">чета</b> вестници.", "I don't read newspapers."],
      q: ["<b class=\"i\">Четеш</b> ли на български?", "Do you read in Bulgarian?"],
      tips: [
        "The <i lang=\"bg\">ти</i>-form tells you the group: <i lang=\"bg\">-еш</i> → I, <i lang=\"bg\">-иш</i> → II, <i lang=\"bg\">-аш / -яш</i> → III. Your PDF list shows exactly this ending.",
        "<i lang=\"bg\">ли</i> goes right after the word you ask about: <i lang=\"bg\">Четеш ли?</i>"
      ]
    },
    {
      id: "aorist", group: "Past", en: "Aorist (simple past)", bg: "Минало свършено време",
      formula: "past stem + -х", short: "a finished event at a known time",
      cells: function (v) { return v.aor; },
      uses: [
        "A completed action at a definite point in the past.",
        "A chain of events in a story: <i lang=\"bg\">Влязох, седнах и поръчах.</i> (I came in, sat down and ordered.)",
        "This is the main past tense for telling what happened."
      ],
      aspect: {
        i: "The activity happened or lasted for a while, without stressing the result: <i lang=\"bg\">Четох два часа.</i>",

      '</article>' +
      '<div class="card"><h3>All tenses at a glance · <span lang="bg">' + v.impf.inf + ' / ' + v.pf.inf + '</span></h3>' +
        '<div class="table-wrap"><table class="glance"><thead><tr><th>Tense</th><th>Formula</th><th>Impf. (аз)</th><th>Perf. (аз)</th><th>Use</th></tr></thead><tbody>' + glance + '</tbody></table></div></div>';
  }

  /* ---------- Which tense? ---------- */
  var FLOW = {
    start: { q: "When does the action happen?", opts: [
      { t: "Now, regularly, or it's always true", s: "I read, I'm reading, I read every day", to: "=present" },
      { t: "In the past", s: "I read, I was reading, I have read, I had read", to: "past" },
      { t: "In the future", s: "I will read, I will have read", to: "future" },
      { t: "It's hypothetical or polite", s: "I would…, would you…?, I would have…", to: "hypo" }
    ] },
    past: { q: "What are you saying about the past action?", opts: [
      { t: "It happened and finished at a known time", s: "Yesterday I read the book. Then I went out.", to: "=aorist" },
      { t: "It was going on, or it was a habit", s: "I was reading when… / I used to read every evening.", to: "=imperfect" },
      { t: "Experience or result that matters now; the time doesn't matter", s: "Have you ever been…? I have read it twice.", to: "=perfect" },
      { t: "It happened before another past event", s: "When we arrived, the film had already started.", to: "=pluperfect" }
    ] },
    future: { q: "What kind of future?", opts: [
      { t: "Simply “will do”", s: "Tomorrow I'll read the chapter.", to: "=future" },
      { t: "It will be finished before a future moment", s: "By Friday I will have read it.", to: "=fp" },
      { t: "A future plan seen from the past", s: "I was going to call you, but…", to: "=fip" }
    ] },
    hypo: { q: "Which one?", opts: [
      { t: "A polite request, wish or advice", s: "I would like… / Would you help me? / I would ask…", to: "=cond" },
      { t: "An unreal past result", s: "If I had known, I would have come.", to: "=fip" },
      { t: "Unreal, and finished by a certain moment", s: "We would have arrived by now.", to: "=fpp" },
      { t: "A command or request to someone", s: "Read this! Don't ask!", to: "=impv" }
    ] }
  };
  var path = [];

  function renderChoose() {
    var el = document.getElementById("choose");
    var last = path[path.length - 1];
    var crumbs = path.length ? '<div class="crumbs">' + path.map(function (p) { return '<span class="crumb">' + p.label + '</span>'; }).join("") + '</div>' : "";
    var body;
    if (last && last.to.charAt(0) === "=") {
      var t = BY_ID[last.to.slice(1)];
      body = '<div class="card result">' +
        '<h3>Use this tense</h3>' +
        '<span class="bgname" lang="bg">' + t.bg + '</span>' +
        '<span class="enname">' + t.en + ' · <span class="formula" lang="bg">' + t.formula + '</span></span>' +
        exHTML(t.examples[0]) +
        '<div class="aspect-notes"><div class="an i"><span class="tag">Impf.</span><span>' + t.aspect.i + '</span></div>' +
        '<div class="an p"><span class="tag">Perf.</span><span>' + t.aspect.p + '</span></div></div>' +
        '<div class="row-btns"><button class="btn" data-open="' + t.id + '">See all forms</button><button class="btn ghost" data-restart>Start again</button></div>' +
        '</div>';
    } else {
      var node = FLOW[last ? last.to : "start"];
      body = '<div class="card"><p class="q">' + node.q + '</p><div class="opts">' +
        node.opts.map(function (o, i) { return '<button class="opt" data-opt="' + i + '"><strong>' + o.t + '</strong><span>' + o.s + '</span></button>'; }).join("") +
        '</div>' + (path.length ? '<div class="row-btns" style="margin-top:12px"><button class="btn ghost" data-back>Back</button></div>' : "") + '</div>';
    }
    el.innerHTML = '<div><h2>Which tense?</h2><p class="lead">Answer two short questions and get the tense, its formula and an example. Then decide the aspect.</p></div>' +
      '<div class="flow">' + crumbs + body + '</div>';
    el._node = last && last.to.charAt(0) !== "=" ? last.to : (last ? null : "start");
  }

  /* ---------- Aspect ---------- */
  function renderAspect() {
    document.getElementById("aspect").innerHTML =
      '<div><h2>Which aspect?</h2><p class="lead">Most Bulgarian verbs come in pairs. In your list the first verb is imperfective and the one with <i lang="bg">да</i> is perfective: <i lang="bg">вземам – да взема, -еш</i>. Choose by asking one question: am I talking about the process, or about one finished action?</p></div>' +
      '<div class="two">' +
        '<div class="card aspect-i"><h3>Imperfective · несвършен вид</h3><p class="big-idea">The action as a process: ongoing, repeated, habitual, or just “the activity”.</p>' +
          '<ul class="clean"><li>What is happening now: <i lang="bg">Чета.</i></li><li>Habits: <i lang="bg">Всеки ден вземам автобус.</i></li><li>Duration: <i lang="bg">Четох два часа.</i></li><li>Negative commands: <i lang="bg">Не вземай!</i></li></ul></div>' +
        '<div class="card aspect-p"><h3>Perfective · свършен вид</h3><p class="big-idea">One complete action with a result or an end point.</p>' +
          '<ul class="clean"><li>A single finished event: <i lang="bg">Прочетох книгата.</i></li><li>One-time future: <i lang="bg">Днес ще взема такси.</i></li><li>Within a time: <i lang="bg">Прочетох я за час.</i></li><li>After <i lang="bg">да / ще / ако / когато</i> in the present.</li></ul></div>' +
      '</div>' +
      '<div class="card"><h3>Aspect in each tense</h3><div class="table-wrap"><table class="plain"><thead><tr><th>Tense</th><th class="i">Imperfective</th><th class="p">Perfective</th></tr></thead><tbody>' +
        '<tr><td>Present</td><td>The normal present</td><td>Never alone. Only after <i lang="bg">да, ще, ако, когато, щом</i></td></tr>' +
        '<tr><td>Aorist</td><td>The activity happened or lasted</td><td>The usual choice: finished, with a result</td></tr>' +
        '<tr><td>Imperfect</td><td>The usual choice: background, habit</td><td>Rare: “whenever” clauses</td></tr>' +
        '<tr><td>Future (<i lang="bg">ще</i>)</td><td>Process, regular action</td><td>One complete action</td></tr>' +
        '<tr><td>Perfect / past perfect</td><td>Experience, activity</td><td>Result</td></tr>' +
        '<tr><td>Imperative</td><td>Repeated actions; all negative commands</td><td>One concrete action (positive)</td></tr>' +
      '</tbody></table></div></div>' +
      '<div class="two">' +
        '<div class="card"><h3>Signal words</h3><div class="p-gap">' +
          '<p><span class="i-txt"><b>Imperfective:</b></span> <span lang="bg">винаги, обикновено, често, рядко, никога, всеки ден, всяка седмица, по цял ден, докато, понякога</span></p>' +
          '<p><span class="p-txt"><b>Perfective:</b></span> <span lang="bg">веднъж, този път, изведнъж, най-накрая, до утре, за пет минути, още сега</span></p>' +
          '<p class="src">Time span: <i lang="bg">Четох час</i> (impf., I read for an hour) vs <i lang="bg">Прочетох я за час</i> (perf., I read it within an hour).</p>' +
        '</div></div>' +
        '<div class="card"><h3>How pairs are formed</h3><div class="p-gap">' +
          '<p><b>Suffix.</b> The imperfective is longer: <span lang="bg">вдигна → вдигам, върна → връщам, заключа → заключвам, целуна → целувам</span></p>' +
          '<p><b>Prefix.</b> The perfective gets a prefix: <span lang="bg">чета → прочета, правя → направя, питам → попитам, пиша → напиша</span></p>' +
          '<p><b>Different stem.</b> <span lang="bg">влизам → вляза, давам → дам, виждам → видя</span></p>' +
          '<p class="src">Tip: the imperfective partner is very often group III (ends in <i lang="bg">-м</i>). The perfective is often group I or II (<i lang="bg">-еш / -иш</i>).</p>' +
        '</div></div>' +
      '</div>' +
      '<div class="card ex"><h3>From your list</h3>' +
        exHTML(["Обикновено <b class=\"i\">вземам</b> автобус, но днес бързам и ще <b class=\"p\">взема</b> такси.", "I usually take the bus, but today I'm in a hurry, so I'll take a taxi."]) +
        exHTML(["<b class=\"i\">Виждам се</b> с приятелите си всеки петък. Тази седмица ще <b class=\"p\">се видя</b> с тях и в събота.", "I see my friends every Friday. This week I'll see them on Saturday as well."]) +
        exHTML(["– Ще <b class=\"p\">добавиш</b> ли нещо към кафето? – Не, никога не <b class=\"i\">добавям</b> нищо.", "– Will you add something to the coffee? – No, I never add anything."]) +
        exHTML(["Рядко <b class=\"i\">закусвам</b> вкъщи, защото винаги бързам. Този път ще <b class=\"p\">закуся</b> яйца на очи.", "I rarely have breakfast at home because I'm always in a hurry. This time I'll have fried eggs."]) +
        '<p class="src">Signal words decide it: <i lang="bg">обикновено, всеки, никога, рядко</i> → imperfective; <i lang="bg">днес, тази седмица, този път</i> → perfective.</p>' +
      '</div>';
  }

  /* ---------- Endings ---------- */
  function renderEndings() {
    document.getElementById("endings").innerHTML =
      '<div><h2>Endings</h2><p class="lead">Bulgarian verbs have three conjugation groups. You can tell the group from the <i lang="bg">ти</i>-form, which is why your list writes <i lang="bg">да взема, -еш</i> and <i lang="bg">да видя, -иш</i>.</p></div>' +
      '<div class="card"><h3>Present tense by group</h3><div class="table-wrap"><table class="plain end" lang="bg"><thead><tr><th>Person</th><th>I · -еш</th><th>II · -иш</th><th>III · -аш / -яш</th></tr></thead><tbody>' +
        '<tr><td>аз</td><td>чет<b>а</b></td><td>прав<b>я</b></td><td>пита<b>м</b></td></tr>' +
        '<tr><td>ти</td><td>чет<b>еш</b></td><td>прав<b>иш</b></td><td>пита<b>ш</b></td></tr>' +
        '<tr><td>той / тя</td><td>чет<b>е</b></td><td>прав<b>и</b></td><td>пита</td></tr>' +
        '<tr><td>ние</td><td>чет<b>ем</b></td><td>прав<b>им</b></td><td>пита<b>ме</b></td></tr>' +
        '<tr><td>вие</td><td>чет<b>ете</b></td><td>прав<b>ите</b></td><td>пита<b>те</b></td></tr>' +
        '<tr><td>те</td><td>чет<b>ат</b></td><td>прав<b>ят</b></td><td>пита<b>т</b></td></tr>' +
      '</tbody></table></div>' +
      '<p class="table-note">Group III always ends in <span lang="bg">-м</span> in the аз-form (<span lang="bg">питам, вземам, добавям</span>). Exceptions in group I: <span lang="bg">дам (дадеш), ям (ядеш)</span>, plus <span lang="bg">съм</span>. More examples: I <span lang="bg">пиша, пия, донеса</span>; II <span lang="bg">видя, мисля, мълча</span>.</p></div>' +
      '<div class="two">' +
        '<div class="card"><h3>Past endings (all groups)</h3><div class="table-wrap"><table class="plain end" lang="bg"><thead><tr><th>Person</th><th>Aorist</th><th>Imperfect</th></tr></thead><tbody>' +
          '<tr><td>аз</td><td>прочето<b>х</b></td><td>четя<b>х</b></td></tr>' +
          '<tr><td>ти</td><td>прочете</td><td>чете<b>ше</b></td></tr>' +
          '<tr><td>той / тя</td><td>прочете</td><td>чете<b>ше</b></td></tr>' +
          '<tr><td>ние</td><td>прочето<b>хме</b></td><td>четя<b>хме</b></td></tr>' +
          '<tr><td>вие</td><td>прочето<b>хте</b></td><td>четя<b>хте</b></td></tr>' +
          '<tr><td>те</td><td>прочето<b>ха</b></td><td>четя<b>ха</b></td></tr>' +
        '</tbody></table></div><p class="table-note">The <span lang="bg">-ше</span> in the ти / той forms is the clearest sign of the imperfect.</p></div>' +
        '<div class="card"><h3>Aorist: the vowel before -х</h3><div class="table-wrap"><table class="plain" lang="bg"><tbody>' +
          '<tr><td>-ох</td><td>чета → четох, донеса → донесох, дойда → дойдох, дам → дадох</td></tr>' +
          '<tr><td>-ах / -ях</td><td>пиша → писах, питам → питах, видя → видях, успея → успях</td></tr>' +
          '<tr><td>-их</td><td>правя → правих, говоря → говорих, забравя → забравих</td></tr>' +
          '<tr><td>-х</td><td>взема → взех, пия → пих, чуя → чух</td></tr>' +
        '</tbody></table></div><p class="table-note">Group III is easy: replace <span lang="bg">-м</span> with <span lang="bg">-х</span>. Learn groups I and II verb by verb.</p></div>' +
      '</div>' +
      '<div class="two">' +
        '<div class="card"><h3>Imperfect: -ях, -ех or -ах?</h3><div class="p-gap">' +
          '<p><b>Groups I and II:</b> drop <span lang="bg">-еш / -иш</span>. If the stress falls on the ending, use <span lang="bg">-ях</span>; if not, use <span lang="bg">-ех</span>. This is a rule of thumb with exceptions.</p>' +
          '<p lang="bg">чета → четях · вървя → вървях · пиша → пишех · правя → правех</p>' +
          '<p><b>After ж, ч, ш</b> a stressed <span lang="bg">-ях</span> becomes <span lang="bg">-ах</span>: <span lang="bg">мълча → мълчах, лежа → лежах</span>.</p>' +
          '<p><b>Group III:</b> <span lang="bg">-м → -х</span>, and the ти / той forms take <span lang="bg">-ше</span>: <span lang="bg">питам → питах, питаше</span>.</p>' +
        '</div></div>' +
        '<div class="card"><h3>The -л participle</h3><div class="p-gap">' +
          '<p>Used in the perfect, past perfect, future perfect and conditional. Take the aorist, drop <span lang="bg">-х</span> and add <span lang="bg">-л</span>.</p>' +
          '<p lang="bg">правих → правил · питах → питал · писах → писал · взех → взел</p>' +
          '<p>Aorists in <span lang="bg">-ох</span> usually end in <span lang="bg">-ъл</span>: <span lang="bg">донесох → донесъл, дойдох → дошъл</span>. Short ones: <span lang="bg">четох → чел, дадох → дал</span>.</p>' +
          '<p>Endings: <span lang="bg">-л</span> (m), <span lang="bg">-ла</span> (f), <span lang="bg">-ло</span> (n), <span lang="bg">-ли</span> (pl). Watch for <span lang="bg">я → е</span> in the plural: <span lang="bg">видял → видели</span>.</p>' +
        '</div></div>' +
      '</div>' +
      '<div class="card"><h3>Imperative</h3><div class="table-wrap"><table class="plain" lang="bg"><thead><tr><th>Type</th><th>ти</th><th>вие</th><th>Examples</th></tr></thead><tbody>' +
        '<tr><td>Groups I & II, consonant stem</td><td>-и</td><td>-ете</td><td>чети / четете, прави / правете, кажи / кажете</td></tr>' +
        '<tr><td>Group III and vowel stems</td><td>-й</td><td>-йте</td><td>питай / питайте, пий / пийте, чуй / чуйте</td></tr>' +
        '<tr><td>Irregular</td><td colspan="3">ела / елате, виж / вижте, дай / дайте, яж / яжте, влез / влезте, излез / излезте</td></tr>' +
      '</tbody></table></div></div>';
  }

  /* ---------- Tabs & events ---------- */
  var TABS = ["tenses", "choose", "aspect", "endings"];
  function setTab(id, push) {
    if (TABS.indexOf(id) < 0) id = "tenses";
    state.tab = id;
    TABS.forEach(function (t) {
      document.getElementById(t).hidden = t !== id;
      document.getElementById("tab-btn-" + t).setAttribute("aria-selected", String(t === id));
    });
    if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) { /* ignore */ } }
  }

  document.querySelector("nav.tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (b) { setTab(b.getAttribute("data-tab"), true); window.scrollTo(0, 0); }
  });

  document.getElementById("tenses").addEventListener("click", function (e) {
    var t = e.target.closest("[data-tense]"), v = e.target.closest("[data-verb]");
    if (t) { state.tense = t.getAttribute("data-tense"); store.set("tense", state.tense); renderTenses(); if (t.tagName === "TR") document.getElementById("tenses").scrollIntoView({ block: "start" }); }
    if (v) { state.verb = v.getAttribute("data-verb"); store.set("verb", state.verb); renderTenses(); }
  });

  document.getElementById("choose").addEventListener("click", function (e) {
    var el = document.getElementById("choose");
    var o = e.target.closest("[data-opt]");
    if (o) {
      var node = FLOW[el._node || "start"];
      var opt = node.opts[+o.getAttribute("data-opt")];
      path.push({ label: opt.t, to: opt.to });
      renderChoose();
      return;
    }
    if (e.target.closest("[data-back]")) { path.pop(); renderChoose(); return; }
    if (e.target.closest("[data-restart]")) { path = []; renderChoose(); return; }
    var open = e.target.closest("[data-open]");
    if (open) {
      state.tense = open.getAttribute("data-open"); store.set("tense", state.tense);
      renderTenses(); setTab("tenses", true); window.scrollTo(0, 0);
    }
  });

  renderTenses(); renderChoose(); renderAspect(); renderEndings();
  setTab((location.hash || "").slice(1), false);
  window.addEventListener("hashchange", function () { setTab(location.hash.slice(1), false); });
})();
</script>
